# TASK-012 Slice 2: production-oriented Compose surface.
#
# Per D-S2-09, this file is a portable local/operator verification surface,
# NOT a claim of production deployment certification. It models the full
# Slice 2 lifecycle:
#
#   * postgres with a health check and persistent database volume;
#   * a one-shot migration service that runs `alembic upgrade head`;
#   * the backend application service (built from backend/Dockerfile);
#   * a persistent artifact volume mounted on /opt/cold-storage/artifacts;
#   * build/deployment identity injection via environment variables;
#   * ordering: migration completes successfully before application
#     readiness is honoured;
#   * liveness/readiness health checks defined on the application service;
#   * NO tracked plaintext production credentials. Operators supply
#     real secrets via COLD_STORAGE_*_PASSWORD_FILE or external secret
#     managers; the Compose file never embeds them.
#
# The existing root `docker-compose.yml` remains the local-development
# surface and is intentionally NOT modified by this file.

services:
  postgres:
    # TASK-012 Slice 2 R1 §6.2.7: digest-pinned base image.
    # Digest from Docker Hub RepoDigest for pgvector/pgvector:0.7.2-pg16.
    image: pgvector/pgvector:0.7.2-pg16@sha256:95732f8f93a33bcd427b8e0e8f9d8ceedb5256a6fe5f2b58a4cd78e943c7e30e
    environment:
      # F-PR76-BLOCKER-04: POSTGRES_PASSWORD is REQUIRED for the
      # official PostgreSQL image to initialize an empty data
      # directory; without it the container refuses to start and the
      # persistent volume remains uninitialized. CI / Compose smoke
      # supply a clearly-flagged CI-only value via the operator-
      # controlled ${POSTGRES_PASSWORD:?...} interpolation. Real
      # production deployments MUST source this value from a secret
      # manager; this Compose file never embeds a real password.
      #
      # We MUST NOT use POSTGRES_HOST_AUTH_METHOD=trust: that would
      # silently disable authentication and make the production
      # credential meaningless. All DSN interpolation below uses the
      # same :?required interpolation so postgres, migration, and
      # backend agree on a single source of truth.
      POSTGRES_DB: ${POSTGRES_DB:-cold_storage}
      POSTGRES_USER: ${POSTGRES_USER:-cold_storage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?postgres password required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cold_storage}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        COLD_STORAGE_BUILD_COMMIT_SHA: ${COLD_STORAGE_BUILD_COMMIT_SHA:?commit SHA is required}
        COLD_STORAGE_BUILD_VERSION: ${COLD_STORAGE_BUILD_VERSION:?build version is required}
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:?source date epoch is required}
    image: cold-storage-backend:${COLD_STORAGE_BUILD_COMMIT_SHA}
    # F-PR76-BLOCKER-02: ``command`` alone does NOT override the
    # image ENTRYPOINT. The image bakes
    # ``ENTRYPOINT ["python", "-m",
    # "cold_storage.bootstrap.production_entrypoint"]`` so the
    # backend service always runs through the production lifespan.
    # The migration service therefore declares its own explicit
    # ``entrypoint`` (Compose ``entrypoint`` does override the
    # image's ENTRYPOINT) that runs the alembic CLI directly. The
    # backend service continues to inherit the image's ENTRYPOINT
    # and exits through the production lifespan.
    # F-PR76-MIGRATION-PYTHON-MODULE: invoke alembic as a
    # Python module (``python -m alembic``) instead of relying on
    # the console-script shim at ``/opt/cold-storage/.venv/bin/alembic``.
    # Console scripts copied from a build venv into the runtime
    # image may be absent on some images, producing
    # ``exec ... alembic: no such file or directory`` (exit 255).
    # The module form is independent of any shebang or binary
    # path and is equivalent in functionality.
    entrypoint: ["python", "-m", "alembic"]
    command: ["upgrade", "head"]
    environment:
      COLD_STORAGE_ENVIRONMENT_ID: production
      COLD_STORAGE_DATABASE_BACKEND: postgresql
      COLD_STORAGE_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cold_storage}:${POSTGRES_PASSWORD:?postgres password required}@postgres:5432/${POSTGRES_DB:-cold_storage}
      COLD_STORAGE_BUILD_COMMIT_SHA: ${COLD_STORAGE_BUILD_COMMIT_SHA:?commit SHA is required}
      COLD_STORAGE_BUILD_VERSION: ${COLD_STORAGE_BUILD_VERSION:?build version is required}
      COLD_STORAGE_DEPLOYMENT_ID: ${COLD_STORAGE_DEPLOYMENT_ID:-migration}
      COLD_STORAGE_STARTUP_PROBE_TIMEOUT_SECONDS: ${COLD_STORAGE_STARTUP_PROBE_TIMEOUT_SECONDS:-120}
      COLD_STORAGE_READINESS_PROBE_TIMEOUT_SECONDS: ${COLD_STORAGE_READINESS_PROBE_TIMEOUT_SECONDS:-30}
      COLD_STORAGE_CONFIG_SCHEMA_VERSION: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: cold-storage-backend:${COLD_STORAGE_BUILD_COMMIT_SHA}
    # The backend service deliberately does NOT declare an
    # ``entrypoint`` here so the image's
    # ``production_entrypoint`` runs unchanged. This is the single
    # source of truth for backend startup; CI must verify the
    # backend image actually binds its port via that entrypoint.
    environment:
      COLD_STORAGE_ENVIRONMENT_ID: production
      COLD_STORAGE_DATABASE_BACKEND: postgresql
      COLD_STORAGE_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cold_storage}:${POSTGRES_PASSWORD:?postgres password required}@postgres:5432/${POSTGRES_DB:-cold_storage}
      COLD_STORAGE_APP_HOST: 0.0.0.0
      COLD_STORAGE_APP_PORT: "8000"
      COLD_STORAGE_STORAGE_DIR: /opt/cold-storage/artifacts
      COLD_STORAGE_ARTIFACT_ENVIRONMENT_ID: production
      COLD_STORAGE_BUILD_COMMIT_SHA: ${COLD_STORAGE_BUILD_COMMIT_SHA:?commit SHA is required}
      COLD_STORAGE_BUILD_VERSION: ${COLD_STORAGE_BUILD_VERSION:?build version is required}
      COLD_STORAGE_DEPLOYMENT_ID: ${COLD_STORAGE_DEPLOYMENT_ID:-deploy}
      COLD_STORAGE_STARTUP_PROBE_TIMEOUT_SECONDS: ${COLD_STORAGE_STARTUP_PROBE_TIMEOUT_SECONDS:-120}
      COLD_STORAGE_READINESS_PROBE_TIMEOUT_SECONDS: ${COLD_STORAGE_READINESS_PROBE_TIMEOUT_SECONDS:-30}
      COLD_STORAGE_CONFIG_SCHEMA_VERSION: "1"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - artifact_data:/opt/cold-storage/artifacts
    ports:
      - "8000:8000"
    # F-PR76-HIGH-05: service-level healthcheck MUST represent
    # readiness, not liveness. Migration ordering, mandatory
    # startup/readiness gates, and the strict-approved admission
    # check all gate container health through ``/health/ready``.
    # ``/health/live`` is exercised separately by CI smoke so a
    # forced readiness failure still returns 200 from liveness
    # while container health flips to unhealthy.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          python -c "from urllib.request import urlopen;
          r = urlopen('http://127.0.0.1:8000/health/ready', timeout=2);
          exit(0 if r.status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  artifact_data:
