name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      execute_live_evidence_capture:
        description: Explicitly authorize the gated local Build A/B capture job
        required: true
        type: boolean
        default: false
      expected_rc_source_sha:
        description: Frozen RC source commit assertion
        required: true
        type: string
        default: 043731fea4e60feb6b929c524c4b68e87ed67bd7
      upload_live_evidence_artifact:
        description: Separately authorize transport of the non-tracked capture package
        required: true
        type: boolean
        default: false
      upload_verified_transport_handoff:
        description: Separately authorize durable upload of the verified transport handoff
        required: true
        type: boolean
        default: false
      verify_live_evidence_artifact_transport:
        description: Separately authorize exact GitHub Artifact transport verification
        required: true
        type: boolean
        default: false
      verify_verified_transport_handoff:
        description: Separately authorize exact durable transport handoff verification
        required: true
        type: boolean
        default: false
      create_live_evidence_attestation:
        description: Separately authorize canonical live attestation creation
        required: true
        type: boolean
        default: false
      assemble_live_evidence:
        description: Separately authorize canonical durable live evidence Assembly
        required: true
        type: boolean
        default: false
      assembly_attestation_handoff:
        description: JSON object with exact attestation Artifact ID, digest, creation run ID, attempt, and head SHA
        required: false
        type: string
        default: ""
      transport_artifact_id:
        description: Exact GitHub Artifact ID from the upload-time handoff receipt
        required: false
        type: string
        default: ""
      transport_artifact_digest:
        description: Upload-time GitHub Artifact digest from the handoff receipt
        required: false
        type: string
        default: ""
      transport_capture_run_id:
        description: Capture workflow run ID from the upload-time handoff receipt
        required: false
        type: string
        default: ""
      transport_capture_run_attempt:
        description: Capture workflow run attempt from the upload-time handoff receipt
        required: false
        type: string
        default: ""
      transport_capture_head_sha:
        description: Capture workflow head SHA from the upload-time handoff receipt
        required: false
        type: string
        default: ""
      handoff_artifact_id:
        description: Exact durable verified-transport handoff Artifact ID
        required: false
        type: string
        default: ""
      handoff_artifact_digest:
        description: Upload-time digest of the durable verified-transport handoff Artifact
        required: false
        type: string
        default: ""
      handoff_transport_run_id:
        description: Transport workflow run ID that uploaded the durable handoff
        required: false
        type: string
        default: ""
      handoff_transport_run_attempt:
        description: Transport workflow run attempt that uploaded the durable handoff
        required: false
        type: string
        default: ""
      handoff_transport_head_sha:
        description: Transport workflow head SHA that uploaded the durable handoff
        required: false
        type: string
        default: ""
      handoff_capture_artifact_id:
        description: Original capture Artifact ID recorded in the D0 receipt
        required: false
        type: string
        default: ""
      handoff_capture_artifact_digest:
        description: Original capture Artifact digest recorded in the D0 receipt
        required: false
        type: string
        default: ""
      handoff_capture_run_id:
        description: Original capture workflow run ID recorded in the D0 receipt
        required: false
        type: string
        default: ""
      handoff_capture_run_attempt:
        description: Original capture workflow run attempt recorded in the D0 receipt
        required: false
        type: string
        default: ""
      handoff_capture_head_sha:
        description: Original capture workflow head SHA recorded in the D0 receipt
        required: false
        type: string
        default: ""

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      # TASK-012 V0.2 Slice 2 PR82 CI Correction R1: fetch-depth: 0 so
      # that the PR head commit object is available for git show /
      # SOURCE_DATE_EPOCH even though PR-event checkout checks out the
      # synthetic merge ref.  The other jobs do not reference a
      # non-checkout commit object, so they keep the default shallow
      # checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve source-derived build timestamp
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_COMMIT_SHA}^{commit}"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${SOURCE_COMMIT_SHA}")"
          test -n "${SOURCE_DATE_EPOCH}"
          case "${SOURCE_DATE_EPOCH}" in
            ''|*[!0-9]*)
              echo "SOURCE_DATE_EPOCH must be a decimal integer" >&2
              exit 1
              ;;
          esac
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "$GITHUB_ENV"
      - name: Docker Compose config (root)
        run: docker compose config
      - name: Docker Compose config (production)
        # TASK-012 Slice 2 CI-only fixtures: these four environment
        # values exist purely to satisfy the production Compose's
        # :?required interpolation. They are NOT real production
        # credentials (POSTGRES_PASSWORD is an explicit CI-only
        # placeholder that no operator or runtime would accept),
        # they are NOT referenced by anything outside the CI smoke
        # surface, and they are never written to disk or to any
        # tracked file.
        env:
          COLD_STORAGE_BUILD_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COLD_STORAGE_BUILD_VERSION: ci-${{ github.run_number }}
          COLD_STORAGE_DEPLOYMENT_ID: ci-${{ github.run_id }}
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
        run: docker compose -f docker-compose.production.yml config
      - name: Backend image build (CI)
        # F-PR76-HIGH-03: build the production image and verify the
        # in-image build-identity authority file is owned by root,
        # mode 0444, and that the application user (uid 1001)
        # cannot write to it.
        env:
          COLD_STORAGE_BUILD_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COLD_STORAGE_BUILD_VERSION: ci-${{ github.run_number }}
          COLD_STORAGE_DEPLOYMENT_ID: ci-${{ github.run_id }}
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
        run: |
          set -euo pipefail
          # TASK-012 V0.2 Slice 2 PR82 CI Correction R1: fail-closed
          # source commit validation.  SOURCE_COMMIT_SHA must resolve
          # to a real commit object before we derive SOURCE_DATE_EPOCH.
          # No fallback to HEAD, merge commit timestamp, or wall clock.
          SOURCE_COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e "${SOURCE_COMMIT_SHA}^{commit}"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${SOURCE_COMMIT_SHA}")"
          test -n "${SOURCE_DATE_EPOCH}"
          docker build \
            --build-arg COLD_STORAGE_BUILD_COMMIT_SHA="${COLD_STORAGE_BUILD_COMMIT_SHA}" \
            --build-arg COLD_STORAGE_BUILD_VERSION="${COLD_STORAGE_BUILD_VERSION}" \
            --build-arg SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            -t cold-storage-backend:ci-smoke \
            -f backend/Dockerfile \
            .
          # F-PR76-NARROW-CONTAINER-CI: override the production
          # image's ENTRYPOINT with the stat binary so the probe
          # does not accidentally invoke production_entrypoint.
          identity_stat="$(
            docker run --rm \
              --entrypoint stat \
              cold-storage-backend:ci-smoke \
              -c '%a %U:%G %n' \
              /opt/cold-storage/build-identity.json
          )"
          echo "identity_stat=$identity_stat"
          file_mode="$(printf '%s\n' "$identity_stat" | awk '{print $1}')"
          file_owner="$(printf '%s\n' "$identity_stat" | awk '{print $2}')"
          if [ "$file_mode" != "444" ]; then
            echo "identity file mode is not 0444: $file_mode" >&2
            exit 1
          fi
          if [ "$file_owner" != "root:root" ]; then
            echo "identity file owner is not root:root: $file_owner" >&2
            exit 1
          fi
      - name: PostgreSQL empty-volume initialization + migration + backend readiness smoke
        # F-PR76-HIGH-03: deterministic container lifecycle smoke.
        # 1. Start PostgreSQL from an empty volume (forces
        #    initialization with the supplied POSTGRES_PASSWORD).
        # 2. Wait for the health check.
        # 3. Run the migration service (entrypoint: alembic,
        #    command: upgrade head).
        # 4. Start the backend service and wait for /health/ready.
        # 5. Verify /health/live is 200 throughout.
        # 6. Stop PostgreSQL to force a dependency failure and
        #    verify readiness returns 503 with a stable code while
        #    liveness remains 200.
        # 7. Always tear the stack down.
        env:
          COLD_STORAGE_BUILD_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COLD_STORAGE_BUILD_VERSION: ci-${{ github.run_number }}
          COLD_STORAGE_DEPLOYMENT_ID: ci-${{ github.run_id }}
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
        run: |
          set -euo pipefail
          IMAGE_TAG="cold-storage-backend:ci-smoke"
          SHA="${COLD_STORAGE_BUILD_COMMIT_SHA}"
          STAMP="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_NUMBER}"
          docker network create "cs-${STAMP}" >/dev/null
          docker volume create "pg-data-${STAMP}" >/dev/null

          # F-PR76-NARROW-CONTAINER-CI: cleanup MUST pre-emptively
          # remove every hand-launched container by name, then
          # run compose down for any compose-managed services, then
          # drop the volume and network.  The hand-launched
          # containers use ``--rm --detach`` which only auto-removes
          # them on a graceful exit; an early failure leaves them
          # running.  ``docker rm -f`` is idempotent and safe even
          # when the container never started.
          cleanup() {
            docker rm -f \
              "backend-${STAMP}" \
              "mig-${STAMP}" \
              "pg-${STAMP}" \
              >/dev/null 2>&1 || true
            docker compose \
              -f docker-compose.production.yml \
              -p "ci-${STAMP}" \
              down --volumes --remove-orphans || true
            docker volume rm \
              "pg-data-${STAMP}" \
              >/dev/null 2>&1 || true
            docker network rm \
              "cs-${STAMP}" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --rm --detach \
            --name "pg-${STAMP}" \
            --network "cs-${STAMP}" \
            -v "pg-data-${STAMP}:/var/lib/postgresql/data" \
            -e "POSTGRES_DB=${POSTGRES_DB:-cold_storage}" \
            -e "POSTGRES_USER=${POSTGRES_USER:-cold_storage}" \
            -e "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
            -p "5432" \
            --health-cmd "pg_isready -U ${POSTGRES_USER:-cold_storage}" \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 30 \
            pgvector/pgvector:pg16

          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "pg-${STAMP}" 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "postgres healthy after ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$status" != "healthy" ]; then
            echo "postgres failed to become healthy: $status" >&2
            docker logs "pg-${STAMP}" >&2 || true
            exit 1
          fi

          # F-PR76-MIGRATION-PYTHON-MODULE: preflight confirms the
          # image contains an importable alembic module BEFORE we
          # spend time spinning up the real migration run.  The
          # module form is independent of any
          # ``/opt/cold-storage/.venv/bin/alembic`` shim, which has
          # previously failed with
          # ``exec ... alembic: no such file or directory`` (exit 255).
          docker run --rm \
            --entrypoint python \
            "${IMAGE_TAG}" \
            -m alembic --version

          docker run --rm \
            --name "mig-${STAMP}" \
            --network "cs-${STAMP}" \
            -e "COLD_STORAGE_ENVIRONMENT_ID=production" \
            -e "COLD_STORAGE_DATABASE_BACKEND=postgresql" \
            -e "COLD_STORAGE_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-cold_storage}:${POSTGRES_PASSWORD}@pg-${STAMP}:5432/${POSTGRES_DB:-cold_storage}" \
            -e "COLD_STORAGE_BUILD_COMMIT_SHA=${SHA}" \
            -e "COLD_STORAGE_BUILD_VERSION=${COLD_STORAGE_BUILD_VERSION}" \
            -e "COLD_STORAGE_DEPLOYMENT_ID=ci-migration" \
            -e "COLD_STORAGE_STARTUP_PROBE_TIMEOUT_SECONDS=30" \
            -e "COLD_STORAGE_READINESS_PROBE_TIMEOUT_SECONDS=10" \
            -e "COLD_STORAGE_CONFIG_SCHEMA_VERSION=1" \
            -e "COLD_STORAGE_DATABASE_ENVIRONMENT_ID=ci-strict" \
            -e "COLD_STORAGE_SECRET_ENVIRONMENT_ID=ci-strict" \
            -e "COLD_STORAGE_ARTIFACT_ENVIRONMENT_ID=ci-strict" \
            --entrypoint python \
            "${IMAGE_TAG}" \
            -m alembic upgrade head

          # F-PR76-STRICT-COEFFICIENT-FIXTURE: provision a one-shot
          # approved-coefficient fixture against the freshly migrated
          # PostgreSQL volume.  Backend production mode runs a
          # fail-closed startup readiness check that requires one
          # APPROVED revision per canonical stage:
          #   zone, cooling_load, equipment, power, investment
          # The migration baseline only stamps the schema; it does
          # not seed any approved revisions.  Without this fixture
          # the backend exits with StartupReadinessError (missing=5).
          #
          # The fixture uses the production approval service so the
          # role_check + citation_validation + approval_state_transition
          # + approval_log + audit_log code paths are all exercised.
          # ``actor`` and ``reviewer`` are distinct (see
          # DuplicatePendingApprovalError guard in
          # CoefficientApprovalService._check_duplicate_pending);
          # ``coefficient.ci`` opens the review, ``coefficient.reviewer``
          # approves.
          #
          # The fixture container is ephemeral; it is destroyed when
          # ``docker run --rm`` returns.  No fixture state touches the
          # migration baseline, the operator runtime, or production
          # default seeds.
          cat > /tmp/cs_coefficient_fixture.py <<'CS_FIXTURE_PY'
          import os
          import sys
          from decimal import Decimal

          from sqlalchemy import create_engine

          from cold_storage.bootstrap.production_composition import (
              compose_production_coefficient_approval_service,
          )
          from cold_storage.bootstrap.startup_readiness import get_required_stages
          from cold_storage.modules.coefficients.application.approval_service import (
              ApprovalRequest,
          )
          from cold_storage.modules.coefficients.infrastructure.database import (
              DatabaseCoefficientService,
          )

          engine = create_engine(os.environ["COLD_STORAGE_DATABASE_URL"])
          service = DatabaseCoefficientService(engine)
          approval = compose_production_coefficient_approval_service(
              engine=engine,
              mutation_service=service,
          )
          required_stages = get_required_stages()
          try:
              for stage_name, _calculation_type in required_stages:
                  citation_stage = stage_name.upper().replace("_", "-")
                  citation = f"INTERNAL:REF-CI-{citation_stage}"
                  definition = service.create_definition(
                      code=f"ci.readiness.{stage_name}",
                      name=f"CI readiness fixture: {stage_name}",
                      description="CI-only strict startup readiness fixture",
                      category=stage_name,
                      canonical_unit="ratio",
                      value_type="decimal",
                      scope_type="global",
                  )
                  revision = service.create_revision(
                      definition_id=definition.id,
                      value_decimal=Decimal("1"),
                      unit="ratio",
                      source_type="standard",
                      source_title="CI strict readiness fixture",
                      source_reference=citation,
                      valid_to=None,
                      created_by="ci",
                  )
                  service.mark_revision_reviewed(
                      definition.id,
                      revision.id,
                      reviewer="coefficient.ci",
                  )
                  approval.approve(
                      ApprovalRequest(
                          definition_id=definition.id,
                          revision_id=revision.id,
                          actor="coefficient.reviewer",
                          reviewer="coefficient.reviewer",
                          correlation_id=f"ci-readiness-{stage_name}",
                          source_citation=citation,
                      )
                  )
              result = approval.validate_startup_readiness(
                  stage_names=required_stages,
              )
              required_count = len(required_stages)
              missing_count = len(result.get("missing", []))
              stale_count = len(result.get("stale", []))
              demoted_count = len(result.get("demoted", []))
              citation_count = len(result.get("citation", []))
              approved_count = required_count - missing_count
              ready = bool(result.get("ready", False))
              print(f"CI_REQUIRED_STAGE_COUNT={required_count}")
              print(f"CI_APPROVED_STAGE_COUNT={approved_count}")
              print(f"CI_MISSING_STAGE_COUNT={missing_count}")
              print(f"CI_STALE_STAGE_COUNT={stale_count}")
              print(f"CI_DEMOTED_STAGE_COUNT={demoted_count}")
              print(f"CI_CITATION_FAILURE_COUNT={citation_count}")
              print(f"CI_STARTUP_READINESS_READY={str(ready).lower()}")
              if not ready or missing_count != 0 or stale_count != 0 or demoted_count != 0 or citation_count != 0:
                  print("CI_APPROVED_COEFFICIENT_FIXTURE=FAIL", file=sys.stderr)
                  sys.exit(1)
              print("CI_APPROVED_COEFFICIENT_FIXTURE=PASS")
          finally:
              engine.dispose()
          CS_FIXTURE_PY
          docker run --rm \
            --network "cs-${STAMP}" \
            --mount type=bind,source=/tmp/cs_coefficient_fixture.py,target=/tmp/cs_coefficient_fixture.py,readonly \
            -e "COLD_STORAGE_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-cold_storage}:${POSTGRES_PASSWORD}@pg-${STAMP}:5432/${POSTGRES_DB:-cold_storage}" \
            --entrypoint python \
            "${IMAGE_TAG}" /tmp/cs_coefficient_fixture.py

          # F-PR76-BACKEND-EXIT-DIAGNOSTIC: launch backend WITHOUT
          # ``--rm`` so a crashed/exited backend container remains
          # inspectable.  ``--rm`` only auto-removes the container
          # on graceful exit; on any other path (OOM, crash, abort)
          # Docker would still remove the container, destroying the
          # diagnostic surface (``docker logs`` returns nothing for
          # an absent container).  The ``cleanup`` trap already
          # force-removes ``backend-${STAMP}`` on EXIT, so omitting
          # ``--rm`` does not leak the container.
          backend_container_id="$(
            docker run --detach \
              --name "backend-${STAMP}" \
              --network "cs-${STAMP}" \
              -p "8000:8000" \
              -e "COLD_STORAGE_ENVIRONMENT_ID=production" \
              -e "COLD_STORAGE_DATABASE_BACKEND=postgresql" \
              -e "COLD_STORAGE_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-cold_storage}:${POSTGRES_PASSWORD}@pg-${STAMP}:5432/${POSTGRES_DB:-cold_storage}" \
              -e "COLD_STORAGE_APP_HOST=0.0.0.0" \
              -e "COLD_STORAGE_APP_PORT=8000" \
              -e "COLD_STORAGE_STORAGE_DIR=/opt/cold-storage/artifacts" \
              -e "COLD_STORAGE_ARTIFACT_ENVIRONMENT_ID=production" \
              -e "COLD_STORAGE_BUILD_COMMIT_SHA=${SHA}" \
              -e "COLD_STORAGE_BUILD_VERSION=${COLD_STORAGE_BUILD_VERSION}" \
              -e "COLD_STORAGE_DEPLOYMENT_ID=ci-backend" \
              -e "COLD_STORAGE_STARTUP_PROBE_TIMEOUT_SECONDS=30" \
              -e "COLD_STORAGE_READINESS_PROBE_TIMEOUT_SECONDS=10" \
              -e "COLD_STORAGE_CONFIG_SCHEMA_VERSION=1" \
              -e "COLD_STORAGE_DATABASE_ENVIRONMENT_ID=ci-strict" \
              -e "COLD_STORAGE_SECRET_ENVIRONMENT_ID=ci-strict" \
              -e "COLD_STORAGE_ARTIFACT_ENVIRONMENT_ID=ci-strict" \
              "${IMAGE_TAG}"
          )"
          echo "backend_container_id=${backend_container_id}"
          # Immediately verify the container exists; if the
          # backend image failed to start at all, Docker returns
          # a non-zero exit and the inspect below fails fast with
          # a clear message instead of silently looping for 120s.
          docker inspect "backend-${STAMP}" >/dev/null

          # F-PR76-NARROW-CONTAINER-CI: the urllib probe MUST
          # handle HTTPError (non-2xx) AND must NOT collapse
          # connection failures into a synthetic "503".  The
          # probe is implemented as a single bash helper that
          # writes the helper Python script to the container
          # via docker exec once, then invokes it for each URL.
          cat > /tmp/cs_probe.py <<'PYEOF'
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen
          try:
              response = urlopen(sys.argv[1], timeout=2)
              status = response.status
              body = response.read().decode("utf-8", errors="replace")
          except HTTPError as exc:
              status = exc.code
              try:
                  body = exc.read().decode("utf-8", errors="replace")
              except Exception:
                  body = ""
          except URLError:
              sys.stderr.write("URLError\n")
              sys.exit(2)
          except Exception as exc:
              sys.stderr.write("INTERNAL_ERROR:" + type(exc).__name__ + "\n")
              sys.exit(2)
          sys.stdout.write(str(status) + "\n")
          sys.stdout.write(body + "\n")
          PYEOF
          # Use docker cp + python invocation pattern: copy script
          # into the container via exec, then read back.  The
          # script is small enough to inline via base64 + exec.
          cs_probe_b64="$(base64 -w0 /tmp/cs_probe.py)"
          docker exec "backend-${STAMP}" bash -c "echo ${cs_probe_b64} | base64 -d > /tmp/cs_probe.py && chmod +x /tmp/cs_probe.py"
          cs_probe() {
            local url="$1"; local out="$2"; local err="$3"
            docker exec "backend-${STAMP}" python /tmp/cs_probe.py "$url" > "$out" 2> "$err"
          }

          # F-PR76-BACKEND-EXIT-DIAGNOSTIC: poll the backend
          # container's runtime status BEFORE each readiness probe.
          # If the container has already exited or died, we dump
          # exit code + OOMKilled + state Error + docker logs
          # immediately, instead of waiting 120s to discover the
          # process is gone.
          for i in $(seq 1 120); do
            container_status="$(
              docker inspect \
                -f '{{.State.Status}}' \
                "backend-${STAMP}" 2>/dev/null || echo "missing"
            )"
            if [ "$container_status" = "exited" ] || \
               [ "$container_status" = "dead" ]; then
              exit_code="$(
                docker inspect \
                  -f '{{.State.ExitCode}}' \
                  "backend-${STAMP}" 2>/dev/null || echo "unknown"
              )"
              oom_killed="$(
                docker inspect \
                  -f '{{.State.OOMKilled}}' \
                  "backend-${STAMP}" 2>/dev/null || echo "unknown"
              )"
              error_text="$(
                docker inspect \
                  -f '{{.State.Error}}' \
                  "backend-${STAMP}" 2>/dev/null || echo "unknown"
              )"
              echo "backend_container_status=${container_status}" >&2
              echo "backend_exit_code=${exit_code}" >&2
              echo "backend_oom_killed=${oom_killed}" >&2
              echo "backend_state_error=${error_text}" >&2
              docker logs \
                --timestamps \
                "backend-${STAMP}" \
                >&2 || true
              exit 1
            fi
            if cs_probe "http://127.0.0.1:8000/health/ready" /tmp/ready_probe.out /tmp/ready_probe.err; then
              code=$(head -n 1 /tmp/ready_probe.out)
              if [ "$code" = "200" ]; then
                echo "ready after ${i}s"
                break
              fi
            else
              code=""
            fi
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "backend /health/ready did not return 200 within 120s; last probe code=${code}" >&2
            cat /tmp/ready_probe.err >&2 || true
            # F-PR76-BACKEND-EXIT-DIAGNOSTIC: even when the
            # container is still "running" but readiness never
            # flipped to 200, dump the container's runtime state
            # (status + health check status) and the full log
            # tail so the next investigator does not have to
            # re-run locally to find why readiness never landed.
            docker inspect \
              -f 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
              "backend-${STAMP}" \
              >&2 || true
            docker logs \
              --timestamps \
              "backend-${STAMP}" \
              >&2 || true
            exit 1
          fi

          # Liveness remains 200
          if ! cs_probe "http://127.0.0.1:8000/health/live" /tmp/live_probe.out /tmp/live_probe.err; then
            echo "liveness probe errored" >&2
            cat /tmp/live_probe.err >&2 || true
            exit 1
          fi
          live=$(head -n 1 /tmp/live_probe.out)
          if [ "$live" != "200" ]; then
            echo "backend /health/live did not return 200: $live" >&2
            cat /tmp/live_probe.err >&2 || true
            exit 1
          fi

          # Identity file mode 0444, owner root, application user
          # cannot write to it.
          file_mode=$(docker exec "backend-${STAMP}" stat -c '%a' /opt/cold-storage/build-identity.json)
          file_owner=$(docker exec "backend-${STAMP}" stat -c '%U:%G' /opt/cold-storage/build-identity.json)
          write_test=$(docker exec -u 1001 "backend-${STAMP}" sh -c 'echo x > /opt/cold-storage/build-identity.json' 2>&1 || echo "denied")
          if [ "$file_mode" != "444" ]; then
            echo "identity file mode is not 0444: $file_mode" >&2
            exit 1
          fi
          if [ "$file_owner" != "root:root" ]; then
            echo "identity file owner is not root:root: $file_owner" >&2
            exit 1
          fi
          if echo "$write_test" | grep -qi 'denied\|read-only\|cannot'; then
            echo "application user cannot write identity file (expected)"
          else
            echo "application user unexpectedly wrote identity file: $write_test" >&2
            exit 1
          fi

          # Runtime UID must be 1001
          uid=$(docker exec "backend-${STAMP}" id -u)
          if [ "$uid" != "1001" ]; then
            echo "backend running as uid $uid, expected 1001" >&2
            exit 1
          fi

          # Stop PostgreSQL to force dependency failure; readiness
          # MUST flip to a real HTTP 503 (NOT a connection failure).
          # Connection-level errors here are explicitly NOT
          # acceptable; only an unambiguous 503 from the server
          # closes this gate.
          docker stop "pg-${STAMP}" >/dev/null
          sleep 2
          set +e
          cs_probe "http://127.0.0.1:8000/health/live" /tmp/live_after.out /tmp/live_after.err
          live_probe_exit=$?
          set -e
          if [ "$live_probe_exit" != "0" ]; then
            echo "liveness probe errored during forced readiness failure (exit $live_probe_exit)" >&2
            cat /tmp/live_after.err >&2 || true
            exit 1
          fi
          live_after=$(head -n 1 /tmp/live_after.out)
          if [ "$live_after" != "200" ]; then
            echo "liveness must remain 200 during forced readiness failure; got $live_after" >&2
            cat /tmp/live_after.err >&2 || true
            exit 1
          fi
          set +e
          cs_probe "http://127.0.0.1:8000/health/ready" /tmp/ready_after.out /tmp/ready_after.err
          ready_probe_exit=$?
          set -e
          if [ "$ready_probe_exit" != "0" ]; then
            echo "readiness probe itself errored (exit $ready_probe_exit); contract requires a real HTTP 503, not a connection failure" >&2
            cat /tmp/ready_after.err >&2 || true
            exit 1
          fi
          ready_after=$(head -n 1 /tmp/ready_after.out)
          ready_after_body=$(tail -n +2 /tmp/ready_after.out)
          echo "ready_after=$ready_after"
          echo "ready_after_body=$ready_after_body"
          if [ "$ready_after" != "503" ]; then
            echo "readiness must return 503 during forced failure; got $ready_after" >&2
            exit 1
          fi

          # Verify response body contains NO raw exception / DSN /
          # password / secret.
          for forbidden in "password" "secret" "DSN" "Traceback" "exception" "://"; do
            if echo "$ready_after_body" | grep -qi "$forbidden"; then
              echo "readiness response leaked forbidden token: $forbidden" >&2
              echo "body: $ready_after_body" >&2
              exit 1
            fi
          done

          docker stop "backend-${STAMP}" >/dev/null 2>&1 || true

  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Backend install
        run: cd backend && uv sync
      - name: Alembic upgrade (SQLite)
        run: cd backend && PYTHONPATH=src DATABASE_BACKEND=sqlite uv run alembic upgrade head
      - name: Alembic downgrade/re-upgrade roundtrip (SQLite)
        run: |
          cd backend
          PYTHONPATH=src DATABASE_BACKEND=sqlite uv run alembic downgrade 0013_add_templates_artifacts
          PYTHONPATH=src DATABASE_BACKEND=sqlite uv run alembic upgrade head
      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Backend tests (SQLite)
        run: cd backend && PYTHONPATH=src DATABASE_BACKEND=sqlite uv run pytest
      - name: Backend architecture tests
        run: cd backend && PYTHONPATH=src uv run pytest tests/architecture
      - name: Backend lint
        run: cd backend && uv run ruff check . && uv run ruff format --check .
      - name: Backend typecheck
        run: cd backend && uv run mypy src

  backend-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
          POSTGRES_DB: cold_storage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cold_storage"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Backend install
        run: cd backend && uv sync
      - name: Alembic upgrade (PostgreSQL)
        env:
          DATABASE_BACKEND: postgresql
          DATABASE_URL: postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/cold_storage_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cold_storage_test
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
        run: cd backend && PYTHONPATH=src uv run alembic upgrade head
      - name: Alembic downgrade/re-upgrade roundtrip (PostgreSQL)
        env:
          DATABASE_BACKEND: postgresql
          DATABASE_URL: postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/cold_storage_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cold_storage_test
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
        run: |
          cd backend
          PYTHONPATH=src uv run alembic downgrade 0013_add_templates_artifacts
          PYTHONPATH=src uv run alembic upgrade head
      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: PostgreSQL integration tests
        env:
          DATABASE_BACKEND: postgresql
          DATABASE_URL: postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/cold_storage_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cold_storage_test
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
        run: cd backend && PYTHONPATH=src uv run pytest -m postgresql -vv --maxfail=1
      - name: PostgreSQL attempt race stability (10x)
        env:
          DATABASE_BACKEND: postgresql
          DATABASE_URL: postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/cold_storage_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cold_storage_test
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
        run: |
          cd backend
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "=== attempt race iteration ${i}/10 ==="
            PYTHONPATH=src uv run pytest \
              -m postgresql \
              tests/integration/test_orchestration_attempt_races_postgresql.py \
              -q
          done
      - name: Backend tests (PostgreSQL)
        env:
          DATABASE_BACKEND: postgresql
          DATABASE_URL: postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/cold_storage_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cold_storage_test
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
        run: cd backend && PYTHONPATH=src uv run pytest -k "not architecture and not postgresql and not sqlite"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend install
        run: cd frontend && npm ci
      - name: Frontend quality
        run: cd frontend && npm run lint && npm run typecheck && npm run test && npm run build

  # TASK-012 Slice 2 R1: release-candidate build and provenance evidence.
  # This job runs the full evidence verification suite: canonical
  # serialization, reproducible build evidence, final image digest,
  # artifact manifest, provenance statement, promotion record, and
  # all 20 negative scenario tests.  It does NOT push to any registry,
  # create tags, or perform deployments.
  release-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The runner integration tests resolve the immutable RC source
          # object from the repository, so shallow history is insufficient.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Backend install
        run: cd backend && uv sync
      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Release evidence lint
        run: cd backend && uv run ruff check src/cold_storage/release/ && uv run ruff format --check src/cold_storage/release/
      - name: Release evidence typecheck
        run: cd backend && uv run mypy src/cold_storage/release/ --strict --ignore-missing-imports
      - name: Release evidence unit tests
        run: |
          cd backend && PYTHONPATH=src uv run pytest \
            tests/unit/test_canonical_serialization.py \
            tests/unit/test_reproducible_build_evidence.py \
            tests/unit/test_final_image_digest.py \
            tests/unit/test_artifact_manifest.py \
            tests/unit/test_provenance_statement.py \
            tests/unit/test_promotion_record.py \
            tests/unit/test_negative_scenarios.py \
            tests/unit/test_regression_b2_b3_b4.py \
            tests/unit/test_live_evidence_runner.py \
            tests/unit/test_artifact_transport.py \
            tests/unit/test_live_attestation.py \
            -q
      - name: Release evidence integration tests
        run: |
          cd backend && PYTHONPATH=src uv run pytest \
            tests/integration/test_release_candidate_evidence.py \
            tests/integration/test_live_evidence_runner.py \
            tests/integration/test_artifact_transport.py \
            -q
      - name: Release evidence architecture tests
        run: |
          cd backend && PYTHONPATH=src uv run pytest \
            tests/architecture/test_release_evidence_boundaries.py \
            -q

  # TASK-012 V0.2 Slice 2 R2: this is a future execution surface only.
  # The job is unavailable on push/pull_request and remains skipped unless a
  # maintainer explicitly dispatches this workflow on main with both inputs.
  # No registry, signing, or promotion is performed here. Artifact upload is
  # separately gated and remains off by default. A durable handoff upload is a
  # later, independently authorized step after the original transport verify.
  live-evidence-capture:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_live_evidence_capture == true && inputs.verify_live_evidence_artifact_transport != true && inputs.upload_verified_transport_handoff != true && inputs.verify_verified_transport_handoff != true && inputs.create_live_evidence_attestation != true && inputs.assemble_live_evidence != true && inputs.expected_rc_source_sha == '043731fea4e60feb6b929c524c4b68e87ed67bd7' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload_evidence.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_evidence.outputs.artifact-digest }}
      artifact_url: ${{ steps.upload_evidence.outputs.artifact-url }}
      artifact_name: task012-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      capture_run_id: ${{ github.run_id }}
      capture_run_attempt: ${{ github.run_attempt }}
      capture_head_sha: ${{ github.sha }}
      capture_head_branch: ${{ github.ref_name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Backend install
        run: cd backend && uv sync
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Verify selected Docker Buildx builder
        run: |
          set -euo pipefail
          test "${{ steps.buildx.outputs.driver }}" = "docker-container"
          docker buildx inspect --bootstrap
          docker buildx inspect --bootstrap \
            | grep -Eq '(^|[[:space:],])linux/amd64(\*|[,[:space:]]|$)'
      - name: Verify live capture dispatch gate
        env:
          EXPECTED_SOURCE_SHA: 043731fea4e60feb6b929c524c4b68e87ed67bd7
          EXPECTED_SOURCE_TREE: b456e77f07a0cef801c57d2f089a318c35c145c4
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${{ inputs.execute_live_evidence_capture }}" = "true"
          test "${{ inputs.expected_rc_source_sha }}" = "${EXPECTED_SOURCE_SHA}"
          git cat-file -e "${EXPECTED_SOURCE_SHA}^{commit}"
          test "$(git rev-parse "${EXPECTED_SOURCE_SHA}^{tree}")" = "${EXPECTED_SOURCE_TREE}"
      - name: Capture local Build A/B evidence
        id: capture
        env:
          TASK012_BUILD_A_B_AUTHORIZED: YES
          EXPECTED_SOURCE_SHA: 043731fea4e60feb6b929c524c4b68e87ed67bd7
        run: |
          set -euo pipefail
          OUTPUT_DIR="${RUNNER_TEMP}/task012-live-evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "output_dir=${OUTPUT_DIR}" >> "${GITHUB_OUTPUT}"
          cd backend
          PYTHONPATH=src uv run python -m cold_storage.release.live_evidence_runner \
            capture-local \
            --execute-builds \
            --tooling-root .. \
            --expected-source-sha "${EXPECTED_SOURCE_SHA}" \
            --output-dir "${OUTPUT_DIR}"
      - name: Upload live evidence artifact
        id: upload_evidence
        if: ${{ inputs.upload_live_evidence_artifact == true }}
        uses: actions/upload-artifact@v4
        with:
          name: task012-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.capture.outputs.output_dir }}
          if-no-files-found: error
          compression-level: 0
          overwrite: false
      - name: Record live evidence artifact metadata
        if: ${{ inputs.upload_live_evidence_artifact == true }}
        env:
          ARTIFACT_ID: ${{ steps.upload_evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_evidence.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload_evidence.outputs.artifact-url }}
          ARTIFACT_NAME: task012-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          CAPTURE_RUN_ID: ${{ github.run_id }}
          CAPTURE_RUN_ATTEMPT: ${{ github.run_attempt }}
          CAPTURE_HEAD_SHA: ${{ github.sha }}
          CAPTURE_HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "### Live Evidence Artifact Handoff"
            echo "artifact-id: ${ARTIFACT_ID}"
            echo "artifact-digest: ${ARTIFACT_DIGEST}"
            echo "artifact-url: ${ARTIFACT_URL}"
            echo "artifact-name: ${ARTIFACT_NAME}"
            echo "capture-run-id: ${CAPTURE_RUN_ID}"
            echo "capture-run-attempt: ${CAPTURE_RUN_ATTEMPT}"
            echo "capture-head-sha: ${CAPTURE_HEAD_SHA}"
            echo "capture-head-branch: ${CAPTURE_HEAD_BRANCH}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # TASK-012 V0.2 Slice 2 R3: verify an already-uploaded capture package by
  # exact Artifact ID. This job is intentionally a separate, mutually
  # exclusive workflow-dispatch surface. Its optional D1 upload is a distinct
  # step and contains only the verified D0 archive plus its D0 receipt.
  live-evidence-artifact-transport-verify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_live_evidence_artifact_transport == true && inputs.execute_live_evidence_capture != true && inputs.verify_verified_transport_handoff != true && inputs.upload_verified_transport_handoff != true && inputs.create_live_evidence_attestation != true && inputs.assemble_live_evidence != true && inputs.expected_rc_source_sha == '043731fea4e60feb6b929c524c4b68e87ed67bd7' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      verified_handoff_artifact_id: ${{ steps.upload_verified_handoff.outputs.artifact-id }}
      verified_handoff_artifact_digest: ${{ steps.upload_verified_handoff.outputs.artifact-digest }}
      verified_handoff_artifact_url: ${{ steps.upload_verified_handoff.outputs.artifact-url }}
      verified_handoff_artifact_name: task012-verified-transport-${{ inputs.transport_capture_run_id }}-${{ inputs.transport_capture_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Backend install
        run: cd backend && uv sync
      - name: Validate transport dispatch inputs
        env:
          VERIFY_TRANSPORT: ${{ inputs.verify_live_evidence_artifact_transport }}
          EXECUTE_CAPTURE: ${{ inputs.execute_live_evidence_capture }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_rc_source_sha }}
          ARTIFACT_ID: ${{ inputs.transport_artifact_id }}
          ARTIFACT_DIGEST: ${{ inputs.transport_artifact_digest }}
          CAPTURE_RUN_ID: ${{ inputs.transport_capture_run_id }}
          CAPTURE_RUN_ATTEMPT: ${{ inputs.transport_capture_run_attempt }}
          CAPTURE_HEAD_SHA: ${{ inputs.transport_capture_head_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${VERIFY_TRANSPORT}" = "true"
          test "${EXECUTE_CAPTURE}" != "true"
          test "${EXPECTED_SOURCE_SHA}" = "043731fea4e60feb6b929c524c4b68e87ed67bd7"
          test -n "${ARTIFACT_ID}"
          test -n "${ARTIFACT_DIGEST}"
          test -n "${CAPTURE_RUN_ID}"
          test -n "${CAPTURE_RUN_ATTEMPT}"
          test -n "${CAPTURE_HEAD_SHA}"
      - name: Verify exact live evidence Artifact transport
        id: transport_verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK012_ARTIFACT_DOWNLOAD_AUTHORIZED: YES
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ inputs.transport_artifact_id }}
          ARTIFACT_DIGEST: ${{ inputs.transport_artifact_digest }}
          CAPTURE_RUN_ID: ${{ inputs.transport_capture_run_id }}
          CAPTURE_RUN_ATTEMPT: ${{ inputs.transport_capture_run_attempt }}
          CAPTURE_HEAD_SHA: ${{ inputs.transport_capture_head_sha }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="${RUNNER_TEMP}/task012-artifact-transport/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "output_dir=${OUTPUT_DIR}" >> "${GITHUB_OUTPUT}"
          cd backend
          PYTHONPATH=src uv run python -m cold_storage.release.artifact_transport \
            verify-download \
            --execute-download \
            --repository "${REPOSITORY}" \
            --artifact-id "${ARTIFACT_ID}" \
            --expected-artifact-digest "${ARTIFACT_DIGEST}" \
            --expected-capture-run-id "${CAPTURE_RUN_ID}" \
            --expected-capture-run-attempt "${CAPTURE_RUN_ATTEMPT}" \
            --expected-capture-head-sha "${CAPTURE_HEAD_SHA}" \
            --output-dir "${OUTPUT_DIR}"

      - name: Upload verified transport handoff
        id: upload_verified_handoff
        if: ${{ inputs.upload_verified_transport_handoff == true && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: task012-verified-transport-${{ inputs.transport_capture_run_id }}-${{ inputs.transport_capture_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.transport_verify.outputs.output_dir }}/verified-artifact.zip
            ${{ steps.transport_verify.outputs.output_dir }}/artifact-transport-receipt.json
          if-no-files-found: error
          compression-level: 0
          overwrite: false
      - name: Record verified transport handoff metadata
        if: ${{ inputs.upload_verified_transport_handoff == true && success() }}
        env:
          VERIFIED_HANDOFF_ARTIFACT_ID: ${{ steps.upload_verified_handoff.outputs.artifact-id }}
          VERIFIED_HANDOFF_ARTIFACT_DIGEST: ${{ steps.upload_verified_handoff.outputs.artifact-digest }}
          VERIFIED_HANDOFF_ARTIFACT_URL: ${{ steps.upload_verified_handoff.outputs.artifact-url }}
          VERIFIED_HANDOFF_ARTIFACT_NAME: task012-verified-transport-${{ inputs.transport_capture_run_id }}-${{ inputs.transport_capture_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_CAPTURE_ARTIFACT_ID: ${{ inputs.transport_artifact_id }}
          SOURCE_CAPTURE_ARTIFACT_DIGEST: ${{ inputs.transport_artifact_digest }}
          SOURCE_CAPTURE_RUN_ID: ${{ inputs.transport_capture_run_id }}
          SOURCE_CAPTURE_RUN_ATTEMPT: ${{ inputs.transport_capture_run_attempt }}
          SOURCE_CAPTURE_HEAD_SHA: ${{ inputs.transport_capture_head_sha }}
          TRANSPORT_RUN_ID: ${{ github.run_id }}
          TRANSPORT_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRANSPORT_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "### Verified Transport Handoff Artifact"
            echo "verified-handoff-artifact-id: ${VERIFIED_HANDOFF_ARTIFACT_ID}"
            echo "verified-handoff-artifact-digest: ${VERIFIED_HANDOFF_ARTIFACT_DIGEST}"
            echo "verified-handoff-artifact-url: ${VERIFIED_HANDOFF_ARTIFACT_URL}"
            echo "verified-handoff-artifact-name: ${VERIFIED_HANDOFF_ARTIFACT_NAME}"
            echo "source-capture-artifact-id: ${SOURCE_CAPTURE_ARTIFACT_ID}"
            echo "source-capture-artifact-digest: ${SOURCE_CAPTURE_ARTIFACT_DIGEST}"
            echo "source-capture-run-id: ${SOURCE_CAPTURE_RUN_ID}"
            echo "source-capture-run-attempt: ${SOURCE_CAPTURE_RUN_ATTEMPT}"
            echo "source-capture-head-sha: ${SOURCE_CAPTURE_HEAD_SHA}"
            echo "transport-run-id: ${TRANSPORT_RUN_ID}"
            echo "transport-run-attempt: ${TRANSPORT_RUN_ATTEMPT}"
            echo "transport-head-sha: ${TRANSPORT_HEAD_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # TASK-012 V0.2 Slice 2: create the exact live write_once_integrity
  # attestation from a freshly restored and re-verified D1 package.
  live-evidence-attestation-create:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_live_evidence_attestation == true && inputs.execute_live_evidence_capture != true && inputs.verify_live_evidence_artifact_transport != true && inputs.upload_verified_transport_handoff != true && inputs.verify_verified_transport_handoff != true && inputs.assemble_live_evidence != true && inputs.expected_rc_source_sha == '043731fea4e60feb6b929c524c4b68e87ed67bd7' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Backend install
        run: cd backend && uv sync
      - name: Validate attestation creation dispatch inputs
        env:
          CREATE_ATTESTATION: ${{ inputs.create_live_evidence_attestation }}
          EXECUTE_CAPTURE: ${{ inputs.execute_live_evidence_capture }}
          VERIFY_TRANSPORT: ${{ inputs.verify_live_evidence_artifact_transport }}
          UPLOAD_HANDOFF: ${{ inputs.upload_verified_transport_handoff }}
          VERIFY_HANDOFF: ${{ inputs.verify_verified_transport_handoff }}
          ASSEMBLE: ${{ inputs.assemble_live_evidence }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_rc_source_sha }}
          D1_ID: ${{ inputs.handoff_artifact_id }}
          D1_DIGEST: ${{ inputs.handoff_artifact_digest }}
          D1_TRANSPORT_RUN_ID: ${{ inputs.handoff_transport_run_id }}
          D1_TRANSPORT_ATTEMPT: ${{ inputs.handoff_transport_run_attempt }}
          D1_TRANSPORT_HEAD_SHA: ${{ inputs.handoff_transport_head_sha }}
          D0_ID: ${{ inputs.handoff_capture_artifact_id }}
          D0_DIGEST: ${{ inputs.handoff_capture_artifact_digest }}
          D0_RUN_ID: ${{ inputs.handoff_capture_run_id }}
          D0_ATTEMPT: ${{ inputs.handoff_capture_run_attempt }}
          D0_HEAD_SHA: ${{ inputs.handoff_capture_head_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${CREATE_ATTESTATION}" = "true"
          test "${EXECUTE_CAPTURE}" != "true"
          test "${VERIFY_TRANSPORT}" != "true"
          test "${UPLOAD_HANDOFF}" != "true"
          test "${VERIFY_HANDOFF}" != "true"
          test "${ASSEMBLE}" != "true"
          test "${EXPECTED_SOURCE_SHA}" = "043731fea4e60feb6b929c524c4b68e87ed67bd7"
          test -n "${D1_ID}"
          test -n "${D1_DIGEST}"
          test -n "${D1_TRANSPORT_RUN_ID}"
          test -n "${D1_TRANSPORT_ATTEMPT}"
          test -n "${D1_TRANSPORT_HEAD_SHA}"
          test -n "${D0_ID}"
          test -n "${D0_DIGEST}"
          test -n "${D0_RUN_ID}"
          test -n "${D0_ATTEMPT}"
          test -n "${D0_HEAD_SHA}"
      - name: Restore and verify authoritative D1
        id: restore_d1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK012_VERIFIED_HANDOFF_DOWNLOAD_AUTHORIZED: YES
          REPOSITORY: ${{ github.repository }}
          D1_ID: ${{ inputs.handoff_artifact_id }}
          D1_DIGEST: ${{ inputs.handoff_artifact_digest }}
          D1_TRANSPORT_RUN_ID: ${{ inputs.handoff_transport_run_id }}
          D1_TRANSPORT_ATTEMPT: ${{ inputs.handoff_transport_run_attempt }}
          D1_TRANSPORT_HEAD_SHA: ${{ inputs.handoff_transport_head_sha }}
          D0_ID: ${{ inputs.handoff_capture_artifact_id }}
          D0_DIGEST: ${{ inputs.handoff_capture_artifact_digest }}
          D0_RUN_ID: ${{ inputs.handoff_capture_run_id }}
          D0_ATTEMPT: ${{ inputs.handoff_capture_run_attempt }}
          D0_HEAD_SHA: ${{ inputs.handoff_capture_head_sha }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="${RUNNER_TEMP}/task012-attestation-d1/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RESULT="$(cd backend && PYTHONPATH=src uv run python -m cold_storage.release.artifact_transport \
            verify-handoff-download \
            --execute-download \
            --repository "${REPOSITORY}" \
            --handoff-artifact-id "${D1_ID}" \
            --expected-handoff-artifact-digest "${D1_DIGEST}" \
            --expected-transport-run-id "${D1_TRANSPORT_RUN_ID}" \
            --expected-transport-run-attempt "${D1_TRANSPORT_ATTEMPT}" \
            --expected-transport-head-sha "${D1_TRANSPORT_HEAD_SHA}" \
            --expected-capture-artifact-id "${D0_ID}" \
            --expected-capture-artifact-digest "${D0_DIGEST}" \
            --expected-capture-run-id "${D0_RUN_ID}" \
            --expected-capture-run-attempt "${D0_ATTEMPT}" \
            --expected-capture-head-sha "${D0_HEAD_SHA}" \
            --output-dir "${OUTPUT_DIR}")"
          printf '%s\n' "${RESULT}"
          printf '%s\n' "${RESULT}" | sed -n 's/^CAPTURE_ROOT=//p' | tail -1 | sed 's/^/capture_root=/' >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${RESULT}" | sed -n 's/^OBSERVATION_BUNDLE=//p' | tail -1 | sed 's/^/observation_bundle=/' >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${RESULT}" | sed -n 's/^HANDOFF_RECEIPT=//p' | tail -1 | sed 's/^/d1_receipt=/' >> "${GITHUB_OUTPUT}"
      - name: Prepare attestation.json from verified observations
        id: create_attestation
        env:
          OBSERVATION_BUNDLE: ${{ steps.restore_d1.outputs.observation_bundle }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_rc_source_sha }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="${RUNNER_TEMP}/task012-live-attestation/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RESULT="$(cd backend && PYTHONPATH=src uv run python -m cold_storage.release.live_attestation \
            create \
            --observation-bundle "${OBSERVATION_BUNDLE}" \
            --tooling-root .. \
            --expected-source-sha "${EXPECTED_SOURCE_SHA}" \
            --output-dir "${OUTPUT_DIR}")"
          printf '%s\n' "${RESULT}"
          echo "output_dir=${OUTPUT_DIR}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${RESULT}" | sed -n 's/^ATTESTATION_FILE=//p' | tail -1 | sed 's/^/attestation_file=/' >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${RESULT}" | sed -n 's/^SUBJECT_DIGEST=//p' | tail -1 | sed 's/^/subject_digest=/' >> "${GITHUB_OUTPUT}"
      - name: Upload live attestation Artifact
        id: upload_attestation
        uses: actions/upload-artifact@v4
        with:
          name: task012-live-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.create_attestation.outputs.attestation_file }}
          if-no-files-found: error
          compression-level: 0
          overwrite: false
      - name: Record live attestation Artifact metadata
        env:
          ARTIFACT_ID: ${{ steps.upload_attestation.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_attestation.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload_attestation.outputs.artifact-url }}
          ARTIFACT_NAME: task012-live-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          SUBJECT_DIGEST: ${{ steps.create_attestation.outputs.subject_digest }}
          ATTESTATION_RUN_ID: ${{ github.run_id }}
          ATTESTATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          ATTESTATION_HEAD_SHA: ${{ github.sha }}
          ATTESTATION_HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "### Live Attestation Artifact Handoff"
            echo "attestation-artifact-id: ${ARTIFACT_ID}"
            echo "attestation-artifact-digest: ${ARTIFACT_DIGEST}"
            echo "attestation-artifact-url: ${ARTIFACT_URL}"
            echo "attestation-artifact-name: ${ARTIFACT_NAME}"
            echo "attestation-run-id: ${ATTESTATION_RUN_ID}"
            echo "attestation-run-attempt: ${ATTESTATION_RUN_ATTEMPT}"
            echo "attestation-head-sha: ${ATTESTATION_HEAD_SHA}"
            echo "attestation-head-branch: ${ATTESTATION_HEAD_BRANCH}"
            echo "subject-digest: ${SUBJECT_DIGEST}"
            echo "attestation-job-name: live-evidence-attestation-create"
          } >> "${GITHUB_STEP_SUMMARY}"

  # TASK-012 V0.2 Slice 2: restore D1 and the exact attestation Artifact in a
  # separate run, recompute P/M/S, then upload only the six durable outputs.
  live-evidence-assembly:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.assemble_live_evidence == true && inputs.create_live_evidence_attestation != true && inputs.execute_live_evidence_capture != true && inputs.verify_live_evidence_artifact_transport != true && inputs.upload_verified_transport_handoff != true && inputs.verify_verified_transport_handoff != true && inputs.expected_rc_source_sha == '043731fea4e60feb6b929c524c4b68e87ed67bd7' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Backend install
        run: cd backend && uv sync
      - name: Validate Assembly dispatch inputs
        env:
          ASSEMBLE: ${{ inputs.assemble_live_evidence }}
          CREATE_ATTESTATION: ${{ inputs.create_live_evidence_attestation }}
          EXECUTE_CAPTURE: ${{ inputs.execute_live_evidence_capture }}
          VERIFY_TRANSPORT: ${{ inputs.verify_live_evidence_artifact_transport }}
          UPLOAD_HANDOFF: ${{ inputs.upload_verified_transport_handoff }}
          VERIFY_HANDOFF: ${{ inputs.verify_verified_transport_handoff }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_rc_source_sha }}
          D1_ID: ${{ inputs.handoff_artifact_id }}
          D1_DIGEST: ${{ inputs.handoff_artifact_digest }}
          D1_TRANSPORT_RUN_ID: ${{ inputs.handoff_transport_run_id }}
          D1_TRANSPORT_ATTEMPT: ${{ inputs.handoff_transport_run_attempt }}
          D1_TRANSPORT_HEAD_SHA: ${{ inputs.handoff_transport_head_sha }}
          D0_ID: ${{ inputs.handoff_capture_artifact_id }}
          D0_DIGEST: ${{ inputs.handoff_capture_artifact_digest }}
          D0_RUN_ID: ${{ inputs.handoff_capture_run_id }}
          D0_ATTEMPT: ${{ inputs.handoff_capture_run_attempt }}
          D0_HEAD_SHA: ${{ inputs.handoff_capture_head_sha }}
          ATTESTATION_HANDOFF_JSON: ${{ inputs.assembly_attestation_handoff }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${ASSEMBLE}" = "true"
          test "${CREATE_ATTESTATION}" != "true"
          test "${EXECUTE_CAPTURE}" != "true"
          test "${VERIFY_TRANSPORT}" != "true"
          test "${UPLOAD_HANDOFF}" != "true"
          test "${VERIFY_HANDOFF}" != "true"
          test "${EXPECTED_SOURCE_SHA}" = "043731fea4e60feb6b929c524c4b68e87ed67bd7"
          test -n "${D1_ID}" && test -n "${D1_DIGEST}"
          test -n "${D1_TRANSPORT_RUN_ID}" && test -n "${D1_TRANSPORT_ATTEMPT}" && test -n "${D1_TRANSPORT_HEAD_SHA}"
          test -n "${D0_ID}" && test -n "${D0_DIGEST}"
          test -n "${D0_RUN_ID}" && test -n "${D0_ATTEMPT}" && test -n "${D0_HEAD_SHA}"
          test -n "${ATTESTATION_HANDOFF_JSON}"
          jq -e 'type == "object" and (keys | sort == ["artifact_digest", "artifact_id", "head_sha", "run_attempt", "run_id"]) and all(.[]; type == "string" and length > 0)' \
            <<<"${ATTESTATION_HANDOFF_JSON}" >/dev/null
      - name: Restore and verify authoritative D1
        id: restore_d1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK012_VERIFIED_HANDOFF_DOWNLOAD_AUTHORIZED: YES
          REPOSITORY: ${{ github.repository }}
          D1_ID: ${{ inputs.handoff_artifact_id }}
          D1_DIGEST: ${{ inputs.handoff_artifact_digest }}
          D1_TRANSPORT_RUN_ID: ${{ inputs.handoff_transport_run_id }}
          D1_TRANSPORT_ATTEMPT: ${{ inputs.handoff_transport_run_attempt }}
          D1_TRANSPORT_HEAD_SHA: ${{ inputs.handoff_transport_head_sha }}
          D0_ID: ${{ inputs.handoff_capture_artifact_id }}
          D0_DIGEST: ${{ inputs.handoff_capture_artifact_digest }}
          D0_RUN_ID: ${{ inputs.handoff_capture_run_id }}
          D0_ATTEMPT: ${{ inputs.handoff_capture_run_attempt }}
          D0_HEAD_SHA: ${{ inputs.handoff_capture_head_sha }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="${RUNNER_TEMP}/task012-assembly-d1/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RESULT="$(cd backend && PYTHONPATH=src uv run python -m cold_storage.release.artifact_transport \
            verify-handoff-download --execute-download \
            --repository "${REPOSITORY}" \
            --handoff-artifact-id "${D1_ID}" \
            --expected-handoff-artifact-digest "${D1_DIGEST}" \
            --expected-transport-run-id "${D1_TRANSPORT_RUN_ID}" \
            --expected-transport-run-attempt "${D1_TRANSPORT_ATTEMPT}" \
            --expected-transport-head-sha "${D1_TRANSPORT_HEAD_SHA}" \
            --expected-capture-artifact-id "${D0_ID}" \
            --expected-capture-artifact-digest "${D0_DIGEST}" \
            --expected-capture-run-id "${D0_RUN_ID}" \
            --expected-capture-run-attempt "${D0_ATTEMPT}" \
            --expected-capture-head-sha "${D0_HEAD_SHA}" \
            --output-dir "${OUTPUT_DIR}")"
          printf '%s\n' "${RESULT}"
          printf '%s\n' "${RESULT}" | sed -n 's/^OBSERVATION_BUNDLE=//p' | tail -1 | sed 's/^/observation_bundle=/' >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${RESULT}" | sed -n 's/^HANDOFF_RECEIPT=//p' | tail -1 | sed 's/^/d1_receipt=/' >> "${GITHUB_OUTPUT}"
      - name: Restore and verify exact attestation Artifact
        id: restore_attestation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK012_ATTESTATION_DOWNLOAD_AUTHORIZED: YES
          REPOSITORY: ${{ github.repository }}
          ATTESTATION_HANDOFF_JSON: ${{ inputs.assembly_attestation_handoff }}
        run: |
          set -euo pipefail
          ATTESTATION_ID="$(jq -er '.artifact_id' <<<"${ATTESTATION_HANDOFF_JSON}")"
          ATTESTATION_DIGEST="$(jq -er '.artifact_digest' <<<"${ATTESTATION_HANDOFF_JSON}")"
          ATTESTATION_RUN_ID="$(jq -er '.run_id' <<<"${ATTESTATION_HANDOFF_JSON}")"
          ATTESTATION_ATTEMPT="$(jq -er '.run_attempt' <<<"${ATTESTATION_HANDOFF_JSON}")"
          ATTESTATION_HEAD_SHA="$(jq -er '.head_sha' <<<"${ATTESTATION_HANDOFF_JSON}")"
          OUTPUT_DIR="${RUNNER_TEMP}/task012-assembly-attestation/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RESULT="$(cd backend && PYTHONPATH=src uv run python -m cold_storage.release.artifact_transport \
            verify-attestation-download --execute-download \
            --repository "${REPOSITORY}" \
            --artifact-id "${ATTESTATION_ID}" \
            --expected-artifact-digest "${ATTESTATION_DIGEST}" \
            --expected-creation-run-id "${ATTESTATION_RUN_ID}" \
            --expected-creation-run-attempt "${ATTESTATION_ATTEMPT}" \
            --expected-creation-head-sha "${ATTESTATION_HEAD_SHA}" \
            --output-dir "${OUTPUT_DIR}")"
          printf '%s\n' "${RESULT}"
          printf '%s\n' "${RESULT}" | sed -n 's/^ATTESTATION_FILE=//p' | tail -1 | sed 's/^/attestation_file=/' >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${RESULT}" | sed -n 's/^ATTESTATION_RECEIPT=//p' | tail -1 | sed 's/^/attestation_receipt=/' >> "${GITHUB_OUTPUT}"
      - name: Assemble and verify live evidence
        id: assemble
        env:
          OBSERVATION_BUNDLE: ${{ steps.restore_d1.outputs.observation_bundle }}
          D1_RECEIPT: ${{ steps.restore_d1.outputs.d1_receipt }}
          ATTESTATION_FILE: ${{ steps.restore_attestation.outputs.attestation_file }}
          ATTESTATION_RECEIPT: ${{ steps.restore_attestation.outputs.attestation_receipt }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_rc_source_sha }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="${RUNNER_TEMP}/task012-assembled-evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cd backend
          PYTHONPATH=src uv run python -m cold_storage.release.live_evidence_runner \
            assemble \
            --observation-bundle "${OBSERVATION_BUNDLE}" \
            --attestation-file "${ATTESTATION_FILE}" \
            --output-dir "${OUTPUT_DIR}" \
            --tooling-root .. \
            --expected-source-sha "${EXPECTED_SOURCE_SHA}" \
            --live-attestation \
            --d1-receipt "${D1_RECEIPT}" \
            --attestation-receipt "${ATTESTATION_RECEIPT}" \
            --assembly-run-id "${GITHUB_RUN_ID}" \
            --assembly-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --assembly-head-sha "${GITHUB_SHA}"
          echo "output_dir=${OUTPUT_DIR}" >> "${GITHUB_OUTPUT}"
      - name: Upload assembled evidence Artifact
        id: upload_assembly
        uses: actions/upload-artifact@v4
        with:
          name: task012-assembled-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.assemble.outputs.output_dir }}/artifact-manifest.json
            ${{ steps.assemble.outputs.output_dir }}/provenance.json
            ${{ steps.assemble.outputs.output_dir }}/evidence-bundle.json
            ${{ steps.assemble.outputs.output_dir }}/assembly-metadata.json
            ${{ steps.assemble.outputs.output_dir }}/SHA256SUMS
            ${{ steps.assemble.outputs.output_dir }}/SHA256SUMS.sha256
          if-no-files-found: error
          compression-level: 0
          overwrite: false
      - name: Record assembled evidence Artifact metadata
        env:
          ARTIFACT_ID: ${{ steps.upload_assembly.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_assembly.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload_assembly.outputs.artifact-url }}
          ARTIFACT_NAME: task012-assembled-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          {
            echo "### Assembled Evidence Artifact Handoff"
            echo "assembled-artifact-id: ${ARTIFACT_ID}"
            echo "assembled-artifact-digest: ${ARTIFACT_DIGEST}"
            echo "assembled-artifact-url: ${ARTIFACT_URL}"
            echo "assembled-artifact-name: ${ARTIFACT_NAME}"
            echo "assembly-run-id: ${GITHUB_RUN_ID}"
            echo "assembly-run-attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "assembly-head-sha: ${GITHUB_SHA}"
            echo "assembly-job-name: live-evidence-assembly"
          } >> "${GITHUB_STEP_SUMMARY}"
  # TASK-012 V0.2 Slice 2 R1: independently verify the durable D1 handoff.
  # This is a later workflow-dispatch surface. It cannot capture, run the
  # original transport verifier, upload, assemble, sign, push, promote, or
  # deploy in the same dispatch.
  live-evidence-verified-transport-handoff-verify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_verified_transport_handoff == true && inputs.execute_live_evidence_capture != true && inputs.verify_live_evidence_artifact_transport != true && inputs.upload_verified_transport_handoff != true && inputs.create_live_evidence_attestation != true && inputs.assemble_live_evidence != true && inputs.expected_rc_source_sha == '043731fea4e60feb6b929c524c4b68e87ed67bd7' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Backend install
        run: cd backend && uv sync
      - name: Validate verified handoff dispatch inputs
        env:
          VERIFY_HANDOFF: ${{ inputs.verify_verified_transport_handoff }}
          EXECUTE_CAPTURE: ${{ inputs.execute_live_evidence_capture }}
          VERIFY_TRANSPORT: ${{ inputs.verify_live_evidence_artifact_transport }}
          UPLOAD_HANDOFF: ${{ inputs.upload_verified_transport_handoff }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_rc_source_sha }}
          CREATE_ATTESTATION: ${{ inputs.create_live_evidence_attestation }}
          ASSEMBLE: ${{ inputs.assemble_live_evidence }}
          HANDOFF_ID: ${{ inputs.handoff_artifact_id }}
          HANDOFF_DIGEST: ${{ inputs.handoff_artifact_digest }}
          TRANSPORT_RUN_ID: ${{ inputs.handoff_transport_run_id }}
          TRANSPORT_RUN_ATTEMPT: ${{ inputs.handoff_transport_run_attempt }}
          TRANSPORT_HEAD_SHA: ${{ inputs.handoff_transport_head_sha }}
          CAPTURE_ARTIFACT_ID: ${{ inputs.handoff_capture_artifact_id }}
          CAPTURE_ARTIFACT_DIGEST: ${{ inputs.handoff_capture_artifact_digest }}
          CAPTURE_RUN_ID: ${{ inputs.handoff_capture_run_id }}
          CAPTURE_RUN_ATTEMPT: ${{ inputs.handoff_capture_run_attempt }}
          CAPTURE_HEAD_SHA: ${{ inputs.handoff_capture_head_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${VERIFY_HANDOFF}" = "true"
          test "${EXECUTE_CAPTURE}" != "true"
          test "${VERIFY_TRANSPORT}" != "true"
          test "${UPLOAD_HANDOFF}" != "true"
          test "${CREATE_ATTESTATION}" != "true"
          test "${ASSEMBLE}" != "true"
          test "${EXPECTED_SOURCE_SHA}" = "043731fea4e60feb6b929c524c4b68e87ed67bd7"
          test -n "${HANDOFF_ID}"
          test -n "${HANDOFF_DIGEST}"
          test -n "${TRANSPORT_RUN_ID}"
          test -n "${TRANSPORT_RUN_ATTEMPT}"
          test -n "${TRANSPORT_HEAD_SHA}"
          test -n "${CAPTURE_ARTIFACT_ID}"
          test -n "${CAPTURE_ARTIFACT_DIGEST}"
          test -n "${CAPTURE_RUN_ID}"
          test -n "${CAPTURE_RUN_ATTEMPT}"
          test -n "${CAPTURE_HEAD_SHA}"
      - name: Verify exact durable transport handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK012_VERIFIED_HANDOFF_DOWNLOAD_AUTHORIZED: YES
          REPOSITORY: ${{ github.repository }}
          HANDOFF_ID: ${{ inputs.handoff_artifact_id }}
          HANDOFF_DIGEST: ${{ inputs.handoff_artifact_digest }}
          TRANSPORT_RUN_ID: ${{ inputs.handoff_transport_run_id }}
          TRANSPORT_RUN_ATTEMPT: ${{ inputs.handoff_transport_run_attempt }}
          TRANSPORT_HEAD_SHA: ${{ inputs.handoff_transport_head_sha }}
          CAPTURE_ARTIFACT_ID: ${{ inputs.handoff_capture_artifact_id }}
          CAPTURE_ARTIFACT_DIGEST: ${{ inputs.handoff_capture_artifact_digest }}
          CAPTURE_RUN_ID: ${{ inputs.handoff_capture_run_id }}
          CAPTURE_RUN_ATTEMPT: ${{ inputs.handoff_capture_run_attempt }}
          CAPTURE_HEAD_SHA: ${{ inputs.handoff_capture_head_sha }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="${RUNNER_TEMP}/task012-verified-transport/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cd backend
          PYTHONPATH=src uv run python -m cold_storage.release.artifact_transport \
            verify-handoff-download \
            --execute-download \
            --repository "${REPOSITORY}" \
            --handoff-artifact-id "${HANDOFF_ID}" \
            --expected-handoff-artifact-digest "${HANDOFF_DIGEST}" \
            --expected-transport-run-id "${TRANSPORT_RUN_ID}" \
            --expected-transport-run-attempt "${TRANSPORT_RUN_ATTEMPT}" \
            --expected-transport-head-sha "${TRANSPORT_HEAD_SHA}" \
            --expected-capture-artifact-id "${CAPTURE_ARTIFACT_ID}" \
            --expected-capture-artifact-digest "${CAPTURE_ARTIFACT_DIGEST}" \
            --expected-capture-run-id "${CAPTURE_RUN_ID}" \
            --expected-capture-run-attempt "${CAPTURE_RUN_ATTEMPT}" \
            --expected-capture-head-sha "${CAPTURE_HEAD_SHA}" \
            --output-dir "${OUTPUT_DIR}"

  # TASK-012 V0.2 Slice 6 Package 1: synthetic data-recovery acceptance.
  # This is a normal push/PR job, not a workflow-dispatch live-production
  # surface. It uses an ephemeral PostgreSQL service and temporary files only.
  recovery-foundation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
          POSTGRES_DB: cold_storage_recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cold_storage -d cold_storage_recovery"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Install PostgreSQL client and CJK font
        run: sudo apt-get update && sudo apt-get install -y postgresql-client fonts-wqy-zenhei
      - name: Backend install
        run: cd backend && uv sync
      - name: Alembic upgrade (recovery service)
        env:
          DATABASE_BACKEND: postgresql
          DATABASE_URL: postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/cold_storage_recovery
          COLD_STORAGE_DATABASE_URL: postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/cold_storage_recovery
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cold_storage_recovery
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
          COLD_STORAGE_ENVIRONMENT_ID: test
          COLD_STORAGE_DATABASE_ENVIRONMENT_ID: recovery-db-ci
          COLD_STORAGE_ARTIFACT_ENVIRONMENT_ID: recovery-artifact-ci
        run: cd backend && PYTHONPATH=src uv run alembic upgrade head
      - name: Recovery foundation gate
        env:
          DATABASE_BACKEND: postgresql
          DATABASE_URL: postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/cold_storage_recovery
          COLD_STORAGE_DATABASE_URL: postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/cold_storage_recovery
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cold_storage_recovery
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
          COLD_STORAGE_ENVIRONMENT_ID: test
          COLD_STORAGE_DATABASE_ENVIRONMENT_ID: recovery-db-ci
          COLD_STORAGE_ARTIFACT_ENVIRONMENT_ID: recovery-artifact-ci
          COLD_STORAGE_STORAGE_DIR: ${{ runner.temp }}/task012-recovery-source
        run: make verify-recovery-foundation
