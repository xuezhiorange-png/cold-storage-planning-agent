name: ci

on:
  push:
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose config (root)
        run: docker compose config
      - name: Docker Compose config (production)
        # TASK-012 Slice 2 CI-only fixtures: these four environment
        # values exist purely to satisfy the production Compose's
        # :?required interpolation. They are NOT real production
        # credentials (POSTGRES_PASSWORD is an explicit CI-only
        # placeholder that no operator or runtime would accept),
        # they are NOT referenced by anything outside the CI smoke
        # surface, and they are never written to disk or to any
        # tracked file.
        env:
          COLD_STORAGE_BUILD_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COLD_STORAGE_BUILD_VERSION: ci-${{ github.run_number }}
          COLD_STORAGE_DEPLOYMENT_ID: ci-${{ github.run_id }}
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
        run: docker compose -f docker-compose.production.yml config
      - name: Backend image build (CI)
        # F-PR76-HIGH-03: build the production image and verify the
        # in-image build-identity authority file is owned by root,
        # mode 0444, and that the application user (uid 1001)
        # cannot write to it.
        env:
          COLD_STORAGE_BUILD_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COLD_STORAGE_BUILD_VERSION: ci-${{ github.run_number }}
          COLD_STORAGE_DEPLOYMENT_ID: ci-${{ github.run_id }}
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
        run: |
          set -euo pipefail
          docker build \
            --build-arg COLD_STORAGE_BUILD_COMMIT_SHA="${COLD_STORAGE_BUILD_COMMIT_SHA}" \
            --build-arg COLD_STORAGE_BUILD_VERSION="${COLD_STORAGE_BUILD_VERSION}" \
            -t cold-storage-backend:ci-smoke \
            -f backend/Dockerfile \
            .
          # F-PR76-NARROW-CONTAINER-CI: override the production
          # image's ENTRYPOINT with the stat binary so the probe
          # does not accidentally invoke production_entrypoint.
          identity_stat="$(
            docker run --rm \
              --entrypoint stat \
              cold-storage-backend:ci-smoke \
              -c '%a %U:%G %n' \
              /opt/cold-storage/build-identity.json
          )"
          echo "identity_stat=$identity_stat"
          file_mode="$(printf '%s\n' "$identity_stat" | awk '{print $1}')"
          file_owner="$(printf '%s\n' "$identity_stat" | awk '{print $2}')"
          if [ "$file_mode" != "444" ]; then
            echo "identity file mode is not 0444: $file_mode" >&2
            exit 1
          fi
          if [ "$file_owner" != "root:root" ]; then
            echo "identity file owner is not root:root: $file_owner" >&2
            exit 1
          fi
      - name: PostgreSQL empty-volume initialization + migration + backend readiness smoke
        # F-PR76-HIGH-03: deterministic container lifecycle smoke.
        # 1. Start PostgreSQL from an empty volume (forces
        #    initialization with the supplied POSTGRES_PASSWORD).
        # 2. Wait for the health check.
        # 3. Run the migration service (entrypoint: alembic,
        #    command: upgrade head).
        # 4. Start the backend service and wait for /health/ready.
        # 5. Verify /health/live is 200 throughout.
        # 6. Stop PostgreSQL to force a dependency failure and
        #    verify readiness returns 503 with a stable code while
        #    liveness remains 200.
        # 7. Always tear the stack down.
        env:
          COLD_STORAGE_BUILD_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COLD_STORAGE_BUILD_VERSION: ci-${{ github.run_number }}
          COLD_STORAGE_DEPLOYMENT_ID: ci-${{ github.run_id }}
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
        run: |
          set -euo pipefail
          IMAGE_TAG="cold-storage-backend:ci-smoke"
          SHA="${COLD_STORAGE_BUILD_COMMIT_SHA}"
          STAMP="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_NUMBER}"
          docker network create "cs-${STAMP}" >/dev/null
          docker volume create "pg-data-${STAMP}" >/dev/null

          # F-PR76-NARROW-CONTAINER-CI: cleanup MUST pre-emptively
          # remove every hand-launched container by name, then
          # run compose down for any compose-managed services, then
          # drop the volume and network.  The hand-launched
          # containers use ``--rm --detach`` which only auto-removes
          # them on a graceful exit; an early failure leaves them
          # running.  ``docker rm -f`` is idempotent and safe even
          # when the container never started.
          cleanup() {
            docker rm -f \
              "backend-${STAMP}" \
              "mig-${STAMP}" \
              "pg-${STAMP}" \
              >/dev/null 2>&1 || true
            docker compose \
              -f docker-compose.production.yml \
              -p "ci-${STAMP}" \
              down --volumes --remove-orphans || true
            docker volume rm \
              "pg-data-${STAMP}" \
              >/dev/null 2>&1 || true
            docker network rm \
              "cs-${STAMP}" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --rm --detach \
            --name "pg-${STAMP}" \
            --network "cs-${STAMP}" \
            -v "pg-data-${STAMP}:/var/lib/postgresql/data" \
            -e "POSTGRES_DB=${POSTGRES_DB:-cold_storage}" \
            -e "POSTGRES_USER=${POSTGRES_USER:-cold_storage}" \
            -e "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
            -p "5432" \
            --health-cmd "pg_isready -U ${POSTGRES_USER:-cold_storage}" \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 30 \
            pgvector/pgvector:pg16

          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "pg-${STAMP}" 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "postgres healthy after ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$status" != "healthy" ]; then
            echo "postgres failed to become healthy: $status" >&2
            docker logs "pg-${STAMP}" >&2 || true
            exit 1
          fi

          # F-PR76-MIGRATION-PYTHON-MODULE: preflight confirms the
          # image contains an importable alembic module BEFORE we
          # spend time spinning up the real migration run.  The
          # module form is independent of any
          # ``/opt/cold-storage/.venv/bin/alembic`` shim, which has
          # previously failed with
          # ``exec ... alembic: no such file or directory`` (exit 255).
          docker run --rm \
            --entrypoint python \
            "${IMAGE_TAG}" \
            -m alembic --version

          docker run --rm \
            --name "mig-${STAMP}" \
            --network "cs-${STAMP}" \
            -e "COLD_STORAGE_ENVIRONMENT_ID=production" \
            -e "COLD_STORAGE_DATABASE_BACKEND=postgresql" \
            -e "COLD_STORAGE_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-cold_storage}:${POSTGRES_PASSWORD}@pg-${STAMP}:5432/${POSTGRES_DB:-cold_storage}" \
            -e "COLD_STORAGE_BUILD_COMMIT_SHA=${SHA}" \
            -e "COLD_STORAGE_BUILD_VERSION=${COLD_STORAGE_BUILD_VERSION}" \
            -e "COLD_STORAGE_DEPLOYMENT_ID=ci-migration" \
            -e "COLD_STORAGE_STARTUP_PROBE_TIMEOUT_SECONDS=30" \
            -e "COLD_STORAGE_READINESS_PROBE_TIMEOUT_SECONDS=10" \
            -e "COLD_STORAGE_CONFIG_SCHEMA_VERSION=1" \
            -e "COLD_STORAGE_DATABASE_ENVIRONMENT_ID=ci-strict" \
            -e "COLD_STORAGE_SECRET_ENVIRONMENT_ID=ci-strict" \
            -e "COLD_STORAGE_ARTIFACT_ENVIRONMENT_ID=ci-strict" \
            --entrypoint python \
            "${IMAGE_TAG}" \
            -m alembic upgrade head

          docker run --rm --detach \
            --name "backend-${STAMP}" \
            --network "cs-${STAMP}" \
            -p "8000:8000" \
            -e "COLD_STORAGE_ENVIRONMENT_ID=production" \
            -e "COLD_STORAGE_DATABASE_BACKEND=postgresql" \
            -e "COLD_STORAGE_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-cold_storage}:${POSTGRES_PASSWORD}@pg-${STAMP}:5432/${POSTGRES_DB:-cold_storage}" \
            -e "COLD_STORAGE_APP_HOST=0.0.0.0" \
            -e "COLD_STORAGE_APP_PORT=8000" \
            -e "COLD_STORAGE_STORAGE_DIR=/opt/cold-storage/artifacts" \
            -e "COLD_STORAGE_ARTIFACT_ENVIRONMENT_ID=production" \
            -e "COLD_STORAGE_BUILD_COMMIT_SHA=${SHA}" \
            -e "COLD_STORAGE_BUILD_VERSION=${COLD_STORAGE_BUILD_VERSION}" \
            -e "COLD_STORAGE_DEPLOYMENT_ID=ci-backend" \
            -e "COLD_STORAGE_STARTUP_PROBE_TIMEOUT_SECONDS=30" \
            -e "COLD_STORAGE_READINESS_PROBE_TIMEOUT_SECONDS=10" \
            -e "COLD_STORAGE_CONFIG_SCHEMA_VERSION=1" \
            -e "COLD_STORAGE_DATABASE_ENVIRONMENT_ID=ci-strict" \
            -e "COLD_STORAGE_SECRET_ENVIRONMENT_ID=ci-strict" \
            -e "COLD_STORAGE_ARTIFACT_ENVIRONMENT_ID=ci-strict" \
            "${IMAGE_TAG}"

          # F-PR76-NARROW-CONTAINER-CI: the urllib probe MUST
          # handle HTTPError (non-2xx) AND must NOT collapse
          # connection failures into a synthetic "503".  The
          # probe is implemented as a single bash helper that
          # writes the helper Python script to the container
          # via docker exec once, then invokes it for each URL.
          cat > /tmp/cs_probe.py <<'PYEOF'
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen
          try:
              response = urlopen(sys.argv[1], timeout=2)
              status = response.status
              body = response.read().decode("utf-8", errors="replace")
          except HTTPError as exc:
              status = exc.code
              try:
                  body = exc.read().decode("utf-8", errors="replace")
              except Exception:
                  body = ""
          except URLError:
              sys.stderr.write("URLError\n")
              sys.exit(2)
          except Exception as exc:
              sys.stderr.write("INTERNAL_ERROR:" + type(exc).__name__ + "\n")
              sys.exit(2)
          sys.stdout.write(str(status) + "\n")
          sys.stdout.write(body + "\n")
          PYEOF
          # Use docker cp + python invocation pattern: copy script
          # into the container via exec, then read back.  The
          # script is small enough to inline via base64 + exec.
          cs_probe_b64="$(base64 -w0 /tmp/cs_probe.py)"
          docker exec "backend-${STAMP}" bash -c "echo ${cs_probe_b64} | base64 -d > /tmp/cs_probe.py && chmod +x /tmp/cs_probe.py"
          cs_probe() {
            local url="$1"; local out="$2"; local err="$3"
            docker exec "backend-${STAMP}" python /tmp/cs_probe.py "$url" > "$out" 2> "$err"
          }

          # Wait for /health/ready to return 200
          for i in $(seq 1 120); do
            if cs_probe "http://127.0.0.1:8000/health/ready" /tmp/ready_probe.out /tmp/ready_probe.err; then
              code=$(head -n 1 /tmp/ready_probe.out)
              if [ "$code" = "200" ]; then
                echo "ready after ${i}s"
                break
              fi
            else
              code=""
            fi
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "backend /health/ready did not return 200; last probe code=$code" >&2
            cat /tmp/ready_probe.err >&2 || true
            docker logs "backend-${STAMP}" >&2 || true
            exit 1
          fi

          # Liveness remains 200
          if ! cs_probe "http://127.0.0.1:8000/health/live" /tmp/live_probe.out /tmp/live_probe.err; then
            echo "liveness probe errored" >&2
            cat /tmp/live_probe.err >&2 || true
            exit 1
          fi
          live=$(head -n 1 /tmp/live_probe.out)
          if [ "$live" != "200" ]; then
            echo "backend /health/live did not return 200: $live" >&2
            cat /tmp/live_probe.err >&2 || true
            exit 1
          fi

          # Identity file mode 0444, owner root, application user
          # cannot write to it.
          file_mode=$(docker exec "backend-${STAMP}" stat -c '%a' /opt/cold-storage/build-identity.json)
          file_owner=$(docker exec "backend-${STAMP}" stat -c '%U:%G' /opt/cold-storage/build-identity.json)
          write_test=$(docker exec -u 1001 "backend-${STAMP}" sh -c 'echo x > /opt/cold-storage/build-identity.json' 2>&1 || echo "denied")
          if [ "$file_mode" != "444" ]; then
            echo "identity file mode is not 0444: $file_mode" >&2
            exit 1
          fi
          if [ "$file_owner" != "root:root" ]; then
            echo "identity file owner is not root:root: $file_owner" >&2
            exit 1
          fi
          if echo "$write_test" | grep -qi 'denied\|read-only\|cannot'; then
            echo "application user cannot write identity file (expected)"
          else
            echo "application user unexpectedly wrote identity file: $write_test" >&2
            exit 1
          fi

          # Runtime UID must be 1001
          uid=$(docker exec "backend-${STAMP}" id -u)
          if [ "$uid" != "1001" ]; then
            echo "backend running as uid $uid, expected 1001" >&2
            exit 1
          fi

          # Stop PostgreSQL to force dependency failure; readiness
          # MUST flip to a real HTTP 503 (NOT a connection failure).
          # Connection-level errors here are explicitly NOT
          # acceptable; only an unambiguous 503 from the server
          # closes this gate.
          docker stop "pg-${STAMP}" >/dev/null
          sleep 2
          set +e
          cs_probe "http://127.0.0.1:8000/health/live" /tmp/live_after.out /tmp/live_after.err
          live_probe_exit=$?
          set -e
          if [ "$live_probe_exit" != "0" ]; then
            echo "liveness probe errored during forced readiness failure (exit $live_probe_exit)" >&2
            cat /tmp/live_after.err >&2 || true
            exit 1
          fi
          live_after=$(head -n 1 /tmp/live_after.out)
          if [ "$live_after" != "200" ]; then
            echo "liveness must remain 200 during forced readiness failure; got $live_after" >&2
            cat /tmp/live_after.err >&2 || true
            exit 1
          fi
          set +e
          cs_probe "http://127.0.0.1:8000/health/ready" /tmp/ready_after.out /tmp/ready_after.err
          ready_probe_exit=$?
          set -e
          if [ "$ready_probe_exit" != "0" ]; then
            echo "readiness probe itself errored (exit $ready_probe_exit); contract requires a real HTTP 503, not a connection failure" >&2
            cat /tmp/ready_after.err >&2 || true
            exit 1
          fi
          ready_after=$(head -n 1 /tmp/ready_after.out)
          ready_after_body=$(tail -n +2 /tmp/ready_after.out)
          echo "ready_after=$ready_after"
          echo "ready_after_body=$ready_after_body"
          if [ "$ready_after" != "503" ]; then
            echo "readiness must return 503 during forced failure; got $ready_after" >&2
            exit 1
          fi

          # Verify response body contains NO raw exception / DSN /
          # password / secret.
          for forbidden in "password" "secret" "DSN" "Traceback" "exception" "://"; do
            if echo "$ready_after_body" | grep -qi "$forbidden"; then
              echo "readiness response leaked forbidden token: $forbidden" >&2
              echo "body: $ready_after_body" >&2
              exit 1
            fi
          done

          docker stop "backend-${STAMP}" >/dev/null 2>&1 || true

  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Backend install
        run: cd backend && uv sync
      - name: Alembic upgrade (SQLite)
        run: cd backend && PYTHONPATH=src DATABASE_BACKEND=sqlite uv run alembic upgrade head
      - name: Alembic downgrade/re-upgrade roundtrip (SQLite)
        run: |
          cd backend
          PYTHONPATH=src DATABASE_BACKEND=sqlite uv run alembic downgrade 0013_add_templates_artifacts
          PYTHONPATH=src DATABASE_BACKEND=sqlite uv run alembic upgrade head
      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Backend tests (SQLite)
        run: cd backend && PYTHONPATH=src DATABASE_BACKEND=sqlite uv run pytest
      - name: Backend architecture tests
        run: cd backend && PYTHONPATH=src uv run pytest tests/architecture
      - name: Backend lint
        run: cd backend && uv run ruff check . && uv run ruff format --check .
      - name: Backend typecheck
        run: cd backend && uv run mypy src

  backend-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
          POSTGRES_DB: cold_storage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cold_storage"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Backend install
        run: cd backend && uv sync
      - name: Alembic upgrade (PostgreSQL)
        env:
          DATABASE_BACKEND: postgresql
          DATABASE_URL: postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/cold_storage_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cold_storage_test
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
        run: cd backend && PYTHONPATH=src uv run alembic upgrade head
      - name: Alembic downgrade/re-upgrade roundtrip (PostgreSQL)
        env:
          DATABASE_BACKEND: postgresql
          DATABASE_URL: postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/cold_storage_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cold_storage_test
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
        run: |
          cd backend
          PYTHONPATH=src uv run alembic downgrade 0013_add_templates_artifacts
          PYTHONPATH=src uv run alembic upgrade head
      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: PostgreSQL integration tests
        env:
          DATABASE_BACKEND: postgresql
          DATABASE_URL: postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/cold_storage_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cold_storage_test
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
        run: cd backend && PYTHONPATH=src uv run pytest -m postgresql -vv --maxfail=1
      - name: PostgreSQL attempt race stability (10x)
        env:
          DATABASE_BACKEND: postgresql
          DATABASE_URL: postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/cold_storage_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cold_storage_test
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
        run: |
          cd backend
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "=== attempt race iteration ${i}/10 ==="
            PYTHONPATH=src uv run pytest \
              -m postgresql \
              tests/integration/test_orchestration_attempt_races_postgresql.py \
              -q
          done
      - name: Backend tests (PostgreSQL)
        env:
          DATABASE_BACKEND: postgresql
          DATABASE_URL: postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/cold_storage_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cold_storage_test
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
        run: cd backend && PYTHONPATH=src uv run pytest -k "not architecture and not postgresql and not sqlite"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend install
        run: cd frontend && npm ci
      - name: Frontend quality
        run: cd frontend && npm run lint && npm run typecheck && npm run test && npm run build
