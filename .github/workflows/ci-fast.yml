name: ci-fast

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# This group cannot cancel ci.yml, main, dispatch or controlled specialist jobs.
concurrency:
  group: ci-fast-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: CI classifier and gate regression
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Identify non-authoritative development scope
        id: classify
        run: python3 scripts/ci/classify_changes.py --development
      - name: Locked backend dependencies
        run: cd backend && uv sync --locked
      - name: Shared pytest CJK font prerequisite
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei
      - name: Stage B, geometry and deterministic resource regression (no factory solve)
        id: backend_regression
        run: >-
          cd backend && PYTHONPATH=src:scripts DATABASE_BACKEND=sqlite uv run pytest
          tests/unit/test_v222_stage_b_balanced_quality.py
          tests/unit/test_v222_stage_b_area_efficiency.py
          tests/unit/test_v222_stage_b_frontage_joint_search.py
          tests/unit/test_v222_stage_b_first_feasible_recovery.py
          tests/unit/test_v222_stage_b_changing_frontage_corridor.py
          tests/unit/test_v222_stage_b_functional_spatial_organization.py
          tests/unit/test_v222_stage_b_entrance_coupled_spatial.py
          tests/unit/test_v222_stage_b_route_refinement.py
          tests/unit/test_v222_stage_b_route_resources.py
          tests/unit/test_v222_access_entrance_normals.py
          tests/unit/test_v222_stage_b_construction_guidance.py
          tests/unit/test_v222_construction_diversity.py
          tests/unit/test_v222_stage_b_pool_execution.py
          tests/unit/test_linux_rss_gate.py
          tests/unit/test_v222_github_full_ci_admission.py
          tests/unit/test_v222_balanced_main_execution.py
          tests/unit/test_v222_balanced_feedback_main_execution.py
          tests/unit/test_v222_stage_b_r4_main_execution.py
          tests/unit/test_v222_stage_b_r5_main_execution.py
          tests/unit/test_v222_stage_b_r6_main_execution.py
          tests/unit/test_v222_stage_b_r7_main_execution.py
          tests/unit/test_v222_stage_b_r9_main_execution.py
          tests/unit/test_v222_stage_b_r10_r2_main_execution.py
          tests/unit/test_v222_functional_room_fit.py
          tests/unit/test_v222_functional_project_input_binding.py
          tests/unit/test_v222_r11_r3_locker_review.py
          tests/unit/test_v222_r11_r4_multi_tier_locker.py
          tests/unit/test_v222_r11_r5_practical_changing.py
          tests/unit/test_v222_r11_r6_full_changing_operation.py
          tests/unit/test_v222_r11_r7_standing_changing.py
          tests/unit/test_v222_r11_r8_cabinet_front.py
          tests/unit/test_v222_r11_r9_space_relayout.py
          tests/unit/test_v222_r11_r10_reverse_sizing.py
          tests/unit/test_v222_r11_r11_sizing_advisory.py
          -m "not physical_rss_linux" -q
          --junitxml=../artifacts/ci-fast/backend-regression.xml
      - name: Preserve actual backend test execution report
        if: ${{ !cancelled() && (steps.backend_regression.outcome == 'success' || steps.backend_regression.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-fast-backend-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-fast/backend-regression.xml
          if-no-files-found: error
      - name: Partition execution and shared fixture contracts (no layout search)
        run: >-
          cd backend && PYTHONPATH=src DATABASE_BACKEND=sqlite uv run pytest
          tests/unit/test_ci_partition_execution.py
          tests/unit/test_v222_p1a_composition_exact_placement.py
          -k "partition or database_guard or baseline_fixture_is_shared" -q
      - name: Architecture and security boundaries
        run: cd backend && PYTHONPATH=src DATABASE_BACKEND=sqlite uv run pytest tests/architecture -q
      - name: Ruff
        run: cd backend && uv run ruff check . && uv run ruff check --config pyproject.toml ../scripts/ci
      - name: Format
        run: cd backend && uv run ruff format --check . && uv run ruff format --check --config pyproject.toml ../scripts/ci
      - name: Mypy
        run: cd backend && uv run mypy src && uv run mypy --strict ../scripts/ci/classify_changes.py ../scripts/ci/ci_gate.py
      - name: Diff whitespace
        if: ${{ steps.classify.outputs.base != '' }}
        env:
          DIFF_BASE: ${{ steps.classify.outputs.base }}
          DIFF_HEAD: ${{ steps.classify.outputs.head }}
        run: git diff --check "$DIFF_BASE" "$DIFF_HEAD"
      - name: Explicit acceptance boundary
        run: echo 'Development feedback only. Full ci.yml pull_request labeled SUCCESS at this exact HEAD is still required.' >> "$GITHUB_STEP_SUMMARY"

  fast-ci-gate:
    if: ${{ always() }}
    needs: fast-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require real fast-checks success
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_GATE_KIND: DEVELOPMENT
        run: python3 scripts/ci/ci_gate.py
