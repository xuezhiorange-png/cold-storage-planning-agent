name: V0.3 P5 Controlled Acceptance and Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit under controlled acceptance
        required: true
        type: string
      source_tree_sha:
        description: Exact main tree under controlled acceptance
        required: true
        type: string
      trusted_operator:
        description: Explicit trusted operator actor; never inferred from github.actor
        required: true
        type: string
      authorization_record_id:
        description: Separately authorized controlled-acceptance record
        required: true
        type: string
      execution_authorized:
        description: Must remain NO until a later stage explicitly authorizes execution
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"

permissions:
  contents: read

jobs:
  controlled-acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cold_storage
          POSTGRES_PASSWORD: cold_storage
          POSTGRES_DB: cold_storage
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cold_storage -d cold_storage"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_TREE_SHA: ${{ inputs.source_tree_sha }}
      TRUSTED_OPERATOR: ${{ inputs.trusted_operator }}
      AUTHORIZATION_RECORD_ID: ${{ inputs.authorization_record_id }}
      EXECUTION_AUTHORIZED_INPUT: ${{ inputs.execution_authorized }}
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: cold_storage
      PGPASSWORD: cold_storage
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate dispatch gates
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${AUTHORIZATION_RECORD_ID}"
          test -n "${TRUSTED_OPERATOR}"
          test "${TRUSTED_OPERATOR}" != "system"
          test "${TRUSTED_OPERATOR}" != "api"
          test "${TRUSTED_OPERATOR}" != "background"
          test "${TRUSTED_OPERATOR}" != "llm"
          test "${GITHUB_SHA}" = "${SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${SOURCE_TREE_SHA}"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          echo "CONTROLLED_ACCEPTANCE_SOURCE_GATE=PASS"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install PostgreSQL client and CJK font
        if: inputs.execution_authorized == 'YES'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client fonts-wqy-zenhei

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Verify harness gates
        working-directory: backend
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/v03-p5-acceptance"
          mkdir -p "${evidence_root}"
          uv run python tests/pilot/run_v03_controlled_acceptance.py verify-gates \
            --authorization-record-id "${AUTHORIZATION_RECORD_ID}" \
            --trusted-operator "${TRUSTED_OPERATOR}" \
            --execution-source-sha "${SOURCE_SHA}" \
            --execution-source-tree-sha "${SOURCE_TREE_SHA}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --git-ref "${GITHUB_REF}" \
            --checked-out-sha "$(git rev-parse HEAD)" \
            --checked-out-tree-sha "$(git rev-parse HEAD^{tree})" \
            --output "${evidence_root}/verify-gates.json"
          uv run python tests/pilot/run_v03_controlled_acceptance.py harness-status \
            --output "${evidence_root}/harness-status.json"

      - name: Execute or refuse scenario per authorization gate
        if: always()
        working-directory: backend
        env:
          PYTHONPATH: src
          V03_P5_CONTROLLED_ACCEPTANCE_EXECUTION_AUTHORIZED: ${{ inputs.execution_authorized == 'YES' && 'YES' || 'NO' }}
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/v03-p5-acceptance"
          mkdir -p "${evidence_root}"
          if [ "${EXECUTION_AUTHORIZED_INPUT}" = "YES" ]; then
            for scenario in A B C; do
              artifact_root="${evidence_root}/scenario-${scenario,,}-sqlite"
              output="${evidence_root}/scenario-${scenario,,}-sqlite-evidence.json"
              uv run python tests/pilot/run_v03_controlled_acceptance.py run \
                --scenario "${scenario}" \
                --authorization-record-id "${AUTHORIZATION_RECORD_ID}" \
                --trusted-operator "${TRUSTED_OPERATOR}" \
                --execution-source-sha "${SOURCE_SHA}" \
                --execution-source-tree-sha "${SOURCE_TREE_SHA}" \
                --backend sqlite \
                --run-index 1 \
                --execution-authorized \
                --artifact-root "${artifact_root}" \
                --output "${output}"
            done
            for scenario in A B C; do
              db="v03_p5_matrix_${scenario,,}"
              psql -d cold_storage -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${db};"
              database_url="postgresql+psycopg2://cold_storage:cold_storage@localhost:5432/${db}"
              COLD_STORAGE_DATABASE_BACKEND=postgresql \
              COLD_STORAGE_DATABASE_URL="${database_url}" \
              uv run alembic upgrade head
              artifact_root="${evidence_root}/scenario-${scenario,,}-postgresql"
              output="${evidence_root}/scenario-${scenario,,}-postgresql-evidence.json"
              uv run python tests/pilot/run_v03_controlled_acceptance.py run \
                --scenario "${scenario}" \
                --authorization-record-id "${AUTHORIZATION_RECORD_ID}" \
                --trusted-operator "${TRUSTED_OPERATOR}" \
                --execution-source-sha "${SOURCE_SHA}" \
                --execution-source-tree-sha "${SOURCE_TREE_SHA}" \
                --backend postgresql \
                --run-index 1 \
                --database-url "${database_url}" \
                --execution-authorized \
                --artifact-root "${artifact_root}" \
                --output "${output}"
            done
            echo "CONTROLLED_ACCEPTANCE_SCENARIO_MATRIX_EXECUTED=YES"
          else
            args=(
              run
              --scenario A
              --authorization-record-id "${AUTHORIZATION_RECORD_ID}"
              --trusted-operator "${TRUSTED_OPERATOR}"
              --execution-source-sha "${SOURCE_SHA}"
              --execution-source-tree-sha "${SOURCE_TREE_SHA}"
              --backend sqlite
              --run-index 1
              --artifact-root "${evidence_root}/scenario-a-sqlite-refusal"
              --output "${evidence_root}/scenario-a-sqlite-refusal.json"
            )
            if uv run python tests/pilot/run_v03_controlled_acceptance.py "${args[@]}"; then
              echo "scenario execution must fail closed without explicit authorization"
              exit 1
            fi
            echo "CONTROLLED_ACCEPTANCE_EXECUTION_REFUSED=YES"
          fi

      - name: Upload harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v03-p5-controlled-acceptance-harness
          path: ${{ runner.temp }}/v03-p5-acceptance
          retention-days: 14
