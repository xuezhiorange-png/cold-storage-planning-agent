name: task012-slice6-s7-e2e-operational-acceptance

on:
  workflow_dispatch:
    inputs:
      execute_s6_07_operational_acceptance:
        description: Explicitly authorize the controlled S6-07 acceptance
        required: true
        type: boolean
        default: false
      expected_source_sha:
        description: Exact main SHA under acceptance
        required: true
        type: string
      s6_06_run_id:
        description: Refreshed S6-06 final evidence workflow run ID
        required: true
        type: string
      s6_06_run_attempt:
        description: Refreshed S6-06 workflow run attempt
        required: true
        type: string
      s6_06_artifact_id:
        description: Refreshed S6-06 final evidence artifact ID
        required: true
        type: string
      s6_06_artifact_digest:
        description: Upload-time digest of the refreshed S6-06 artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  s6-07-controlled-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      EXECUTE_S6_07_OPERATIONAL_ACCEPTANCE: ${{ inputs.execute_s6_07_operational_acceptance }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      S6_06_RUN_ID: ${{ inputs.s6_06_run_id }}
      S6_06_RUN_ATTEMPT: ${{ inputs.s6_06_run_attempt }}
      S6_06_ARTIFACT_ID: ${{ inputs.s6_06_artifact_id }}
      S6_06_ARTIFACT_DIGEST: ${{ inputs.s6_06_artifact_digest }}
      S6_07_POSTGRES_PASSWORD: synthetic-only-s6-07-password
      POSTGRES_PASSWORD: synthetic-only-s6-07-password
      POSTGRES_DB: cold_storage_s6_07
      POSTGRES_USER: cold_storage

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize S6-07 diagnostics root
        run: |
          set -euo pipefail
          RUN_ROOT="${RUNNER_TEMP}/task012-s6-07/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DIAGNOSTIC_ROOT="${RUN_ROOT}/diagnostics"
          mkdir -p "${DIAGNOSTIC_ROOT}"
          {
            echo "RUN_ROOT=${RUN_ROOT}"
            echo "DIAGNOSTIC_ROOT=${DIAGNOSTIC_ROOT}"
          } >> "${GITHUB_ENV}"
          printf '%s\n' "RUN_ROOT=${RUN_ROOT}" "DIAGNOSTIC_ROOT=${DIAGNOSTIC_ROOT}"

      - uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies
        run: cd backend && uv sync

      - name: Validate exact source and controlled execution gate
        run: |
          set -euo pipefail
          {
            echo "S6_07_CURRENT_STEP=validate_exact_source"
            echo "S6_07_FAILURE_CODE=S6_07_SOURCE_SHA_MISMATCH"
          } >> "${GITHUB_ENV}"
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "ERROR_CODE=S6_07_EXECUTION_NOT_AUTHORIZED"
            echo "S6_07_FAILURE_CODE=S6_07_EXECUTION_NOT_AUTHORIZED" >> "${GITHUB_ENV}"
            exit 1
          fi
          if [ "${EXECUTE_S6_07_OPERATIONAL_ACCEPTANCE}" != "true" ]; then
            echo "ERROR_CODE=S6_07_EXECUTION_NOT_AUTHORIZED"
            echo "S6_07_FAILURE_CODE=S6_07_EXECUTION_NOT_AUTHORIZED" >> "${GITHUB_ENV}"
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "ERROR_CODE=S6_07_EXECUTION_NOT_AUTHORIZED"
            echo "S6_07_FAILURE_CODE=S6_07_EXECUTION_NOT_AUTHORIZED" >> "${GITHUB_ENV}"
            exit 1
          fi
          PYTHONPATH=backend/src uv run --project backend python \
            -m cold_storage.release.end_to_end_operational_acceptance \
            validate-s6-07-inputs \
            --source-sha "${EXPECTED_SOURCE_SHA}" \
            --s6-06-run-id "${S6_06_RUN_ID}" \
            --s6-06-run-attempt "${S6_06_RUN_ATTEMPT}" \
            --s6-06-artifact-id "${S6_06_ARTIFACT_ID}" \
            --s6-06-artifact-digest "${S6_06_ARTIFACT_DIGEST}" || {
              echo "ERROR_CODE=S6_07_INPUT_VALIDATION_FAILED"
              echo "S6_07_FAILURE_CODE=S6_07_INPUT_VALIDATION_FAILED" >> "${GITHUB_ENV}"
              exit 1
            }
          if ! printf '%s' "${EXPECTED_SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR_CODE=S6_07_SOURCE_SHA_MISMATCH"
            echo "S6_07_FAILURE_CODE=S6_07_SOURCE_SHA_MISMATCH" >> "${GITHUB_ENV}"
            exit 1
          fi
          if [ "${GITHUB_SHA}" != "${EXPECTED_SOURCE_SHA}" ] ||
             [ "$(git rev-parse HEAD)" != "${EXPECTED_SOURCE_SHA}" ]; then
            echo "ERROR_CODE=S6_07_SOURCE_SHA_MISMATCH"
            echo "S6_07_FAILURE_CODE=S6_07_SOURCE_SHA_MISMATCH" >> "${GITHUB_ENV}"
            exit 1
          fi
          SOURCE_TREE_SHA="$(git rev-parse HEAD^{tree})"
          if ! printf '%s' "${SOURCE_TREE_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR_CODE=S6_07_SOURCE_TREE_INVALID"
            echo "S6_07_FAILURE_CODE=S6_07_SOURCE_TREE_INVALID" >> "${GITHUB_ENV}"
            exit 1
          fi
          if ! git merge-base --is-ancestor \
            5adda901285b8a567dac10460dd9e9fa72ea58a0 "${GITHUB_SHA}"; then
            echo "ERROR_CODE=S6_07_PACKAGE3_IMPLEMENTATION_ANCESTRY_MISMATCH"
            echo "S6_07_FAILURE_CODE=S6_07_PACKAGE3_IMPLEMENTATION_ANCESTRY_MISMATCH" >> "${GITHUB_ENV}"
            exit 1
          fi
          if ! git merge-base --is-ancestor \
            c287aba48201ac9bfc0786f62911cd25fabf3fc4 "${GITHUB_SHA}"; then
            echo "ERROR_CODE=S6_07_IMPLEMENTATION_BASE_ANCESTRY_MISMATCH"
            echo "S6_07_FAILURE_CODE=S6_07_IMPLEMENTATION_BASE_ANCESTRY_MISMATCH" >> "${GITHUB_ENV}"
            exit 1
          fi
          {
            echo "SOURCE_SHA=${EXPECTED_SOURCE_SHA}"
            echo "SOURCE_TREE_SHA=${SOURCE_TREE_SHA}"
          } >> "${GITHUB_ENV}"
          echo "S6_07_EXACT_SOURCE_GATE=PASS"
          echo "PACKAGE3_IMPLEMENTATION_HEAD_ANCESTOR_GATE=PASS"
          echo "IMPLEMENTATION_BASE_ANCESTOR_GATE=PASS"

      - name: Read and verify refreshed S6-06 authority
        run: |
          set -euo pipefail
          {
            echo "S6_07_CURRENT_STEP=verify_s6_06_authority"
            echo "S6_07_FAILURE_CODE=S6_07_S6_06_VERIFICATION_FAILED"
          } >> "${GITHUB_ENV}"
          S6_06_BUNDLE="${RUN_ROOT}/s6-06-bundle"
          S6_06_METADATA="${RUN_ROOT}/s6-06-metadata"
          mkdir -p "${RUN_ROOT}" "${S6_06_METADATA}"
          gh_api_with_retry() {
            local endpoint="$1"
            local output="$2"
            local error_code="$3"
            local attempt
            for attempt in 1 2 3; do
              if timeout 45s gh api --header 'Accept: application/vnd.github+json' \
                "${endpoint}" > "${output}"; then
                return 0
              fi
              rm -f "${output}"
              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 2))
              fi
            done
            echo "ERROR_CODE=${error_code}"
            return 1
          }

          gh_api_with_retry \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${S6_06_RUN_ID}" \
            "${RUN_ROOT}/s6-06-run.json" S6_07_GITHUB_METADATA_FETCH_FAILED
          gh_api_with_retry \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${S6_06_ARTIFACT_ID}" \
            "${RUN_ROOT}/s6-06-artifact.json" S6_07_GITHUB_METADATA_FETCH_FAILED

          cp "${RUN_ROOT}/s6-06-run.json" \
            "${S6_06_METADATA}/run-${S6_06_RUN_ID}.json"
          cp "${RUN_ROOT}/s6-06-artifact.json" \
            "${S6_06_METADATA}/artifact-${S6_06_ARTIFACT_ID}.json"

          gh_api_with_retry \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${S6_06_ARTIFACT_ID}/zip" \
            "${RUN_ROOT}/s6-06.zip" S6_07_GITHUB_METADATA_FETCH_FAILED
          PYTHONPATH=backend/src uv run --project backend python \
            -m cold_storage.release.end_to_end_operational_acceptance \
            verify-s6-06-archive-digest --archive "${RUN_ROOT}/s6-06.zip" \
            --expected-digest "${S6_06_ARTIFACT_DIGEST}" || {
              echo "ERROR_CODE=S6_07_S6_06_DIGEST_MISMATCH"
              echo "S6_07_FAILURE_CODE=S6_07_S6_06_DIGEST_MISMATCH" >> "${GITHUB_ENV}"
              exit 1
            }
          PYTHONPATH=backend/src uv run --project backend python \
            -m cold_storage.release.end_to_end_operational_acceptance \
            extract-s6-06-artifact --archive "${RUN_ROOT}/s6-06.zip" --output-dir "${S6_06_BUNDLE}"
          if [ "$(find "${S6_06_BUNDLE}" -mindepth 1 -maxdepth 1 | wc -l)" -ne 8 ]; then
            echo "ERROR_CODE=S6_07_S6_06_VERIFICATION_FAILED"
            echo "S6_07_FAILURE_CODE=S6_07_S6_06_VERIFICATION_FAILED" >> "${GITHUB_ENV}"
            exit 1
          fi

          while IFS= read -r run_id; do
            if [ "${run_id}" = "${S6_06_RUN_ID}" ]; then
              continue
            fi
            gh_api_with_retry \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              "${S6_06_METADATA}/run-${run_id}.json" S6_07_GITHUB_METADATA_FETCH_FAILED
          done < <(jq -r '.authorities[] | select(.workflow_run_id != null) | .workflow_run_id' \
            "${S6_06_BUNDLE}/authority-index.json" | sort -nu)
          while IFS= read -r artifact_id; do
            if [ "${artifact_id}" = "${S6_06_ARTIFACT_ID}" ]; then
              continue
            fi
            gh_api_with_retry \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
              "${S6_06_METADATA}/artifact-${artifact_id}.json" S6_07_GITHUB_METADATA_FETCH_FAILED
          done < <(jq -r '.authorities[] | select(.artifact_id != null) | .artifact_id' \
            "${S6_06_BUNDLE}/authority-index.json" | sort -nu)

          PYTHONPATH=backend/src uv run --project backend python \
            -m cold_storage.release.end_to_end_operational_acceptance \
            verify-s6-06-prerequisite \
            --source-sha "${SOURCE_SHA}" --source-tree-sha "${SOURCE_TREE_SHA}" \
            --s6-06-run-id "${S6_06_RUN_ID}" --s6-06-run-attempt "${S6_06_RUN_ATTEMPT}" \
            --s6-06-artifact-id "${S6_06_ARTIFACT_ID}" \
            --s6-06-artifact-digest "${S6_06_ARTIFACT_DIGEST}" \
            --s6-06-bundle-dir "${S6_06_BUNDLE}" \
            --s6-06-metadata-dir "${S6_06_METADATA}"
          {
            echo "RUN_ROOT=${RUN_ROOT}"
            echo "S6_06_BUNDLE=${S6_06_BUNDLE}"
            echo "S6_06_METADATA=${S6_06_METADATA}"
          } >> "${GITHUB_ENV}"
          echo "S6_06_VERIFICATION_RESULT=PASS"

      - name: Build and start synthetic strict runtime
        run: |
          set -euo pipefail
          {
            echo "S6_07_CURRENT_STEP=build_and_start_runtime"
            echo "S6_07_FAILURE_CODE=S6_07_RUNTIME_BUILD_START_FAILED"
          } >> "${GITHUB_ENV}"
          curl_controlled() {
            curl --connect-timeout 5 --max-time 30 --retry 2 --retry-delay 2 \
              --retry-connrefused "$@"
          }
          COMPOSE_OVERRIDE="${RUN_ROOT}/resource-identities.yml"
          printf '%s\n' \
            'services:' \
            '  migration:' \
            '    environment:' \
            '      COLD_STORAGE_DATABASE_ENVIRONMENT_ID: ci-strict' \
            '      COLD_STORAGE_SECRET_ENVIRONMENT_ID: ci-strict' \
            '      COLD_STORAGE_ARTIFACT_ENVIRONMENT_ID: ci-strict' \
            '      COLD_STORAGE_ARTIFACT_STORAGE_DIR: /opt/cold-storage/artifacts' \
            '  backend:' \
            '    environment:' \
            '      COLD_STORAGE_DATABASE_ENVIRONMENT_ID: ci-strict' \
            '      COLD_STORAGE_SECRET_ENVIRONMENT_ID: ci-strict' \
            '      COLD_STORAGE_ARTIFACT_ENVIRONMENT_ID: ci-strict' \
            '      COLD_STORAGE_ARTIFACT_STORAGE_DIR: /opt/cold-storage/artifacts' \
            > "${COMPOSE_OVERRIDE}"
          printf 'COMPOSE_OVERRIDE=%s\n' "${COMPOSE_OVERRIDE}" >> "${GITHUB_ENV}"
          printf 'RUNTIME_CONTEXT_INITIALIZED=true\n' >> "${GITHUB_ENV}"
          export RUNTIME_CONTEXT_INITIALIZED=true
          export POSTGRES_PASSWORD="${S6_07_POSTGRES_PASSWORD}"
          export POSTGRES_DB=cold_storage_s6_07
          export POSTGRES_USER=cold_storage
          export COLD_STORAGE_BUILD_COMMIT_SHA="${SOURCE_SHA}"
          export COLD_STORAGE_BUILD_VERSION=v0.2.0
          export COLD_STORAGE_DEPLOYMENT_ID="s6-07-${GITHUB_RUN_ID}"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${SOURCE_SHA}")"
          export COMPOSE_PROJECT_NAME="task012-s6-07-${GITHUB_RUN_ID}"
          {
            echo "COLD_STORAGE_BUILD_COMMIT_SHA=${COLD_STORAGE_BUILD_COMMIT_SHA}"
            echo "COLD_STORAGE_BUILD_VERSION=${COLD_STORAGE_BUILD_VERSION}"
            echo "COLD_STORAGE_DEPLOYMENT_ID=${COLD_STORAGE_DEPLOYMENT_ID}"
            echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
            echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}"
          } >> "${GITHUB_ENV}"
          docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" build backend
          docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" up -d postgres
          printf 'S6_07_FAILURE_CODE=S6_07_MIGRATION_FAILED\n' >> "${GITHUB_ENV}"
          set +e
          migration_upgrade_output="$(docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" run --rm migration upgrade head 2>&1)"
          migration_exit_code=$?
          set -e
          printf '%s\n' "${migration_upgrade_output}" > "${RUN_ROOT}/alembic-upgrade.txt"
          test "${migration_exit_code}" -eq 0
          migration_output="$(docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" run --rm migration current 2>&1)"
          printf '%s\n' "${migration_output}" > "${RUN_ROOT}/alembic-current.txt"
          grep -Eq '\(head\)' "${RUN_ROOT}/alembic-current.txt"

          export S6_07_POSTGRES_URL="postgresql+psycopg2://cold_storage:${S6_07_POSTGRES_PASSWORD}@127.0.0.1:5432/cold_storage_s6_07"
          echo "S6_07_POSTGRES_URL=${S6_07_POSTGRES_URL}" >> "${GITHUB_ENV}"
          readiness_seed_json="${RUN_ROOT}/readiness-seed.json"
          PYTHONPATH=backend/src uv run --project backend python \
            -m cold_storage.bootstrap.s6_07_controlled_fixture \
            seed-startup-readiness \
            --database-url "${S6_07_POSTGRES_URL}" \
            --token "${GITHUB_RUN_ID}" \
            --output "${readiness_seed_json}"
          jq -e '.ready == true and .required_stage_count == 5 and
                 .seeded_stage_count == 5 and .startup_readiness_seed == "PASS"' \
            "${readiness_seed_json}"
          echo "STARTUP_REQUIRED_STAGE_COUNT=$(jq -r '.required_stage_count' "${readiness_seed_json}")"
          echo "STARTUP_SEEDED_STAGE_COUNT=$(jq -r '.seeded_stage_count' "${readiness_seed_json}")"
          echo "STARTUP_READINESS_SEED=PASS"
          echo "READINESS_SEED_BEFORE_BACKEND_START=PASS"
          docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" up -d backend
          for _ in $(seq 1 30); do
            if curl_controlled --fail --silent http://127.0.0.1:8000/health/live >/dev/null &&
               curl_controlled --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          curl_controlled --fail --silent http://127.0.0.1:8000/health/live >/dev/null
          curl_controlled --fail --silent http://127.0.0.1:8000/health/ready >/dev/null
          live_status="$(curl_controlled --silent --show-error --output "${RUN_ROOT}/live-response-body.json" \
            --write-out '%{http_code}' http://127.0.0.1:8000/health/live)"
          jq -n --argjson status "${live_status}" --slurpfile body "${RUN_ROOT}/live-response-body.json" \
            '{status:$status,body:$body[0]}' > "${RUN_ROOT}/live-response.json"
          docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" exec -T backend \
            cat /opt/cold-storage/build-identity.json > "${RUN_ROOT}/build-identity.json"
          jq -e --arg commit_sha "${SOURCE_SHA}" --arg version "v0.2.0" \
            '.commit_sha == $commit_sha and .version == $version' \
            "${RUN_ROOT}/build-identity.json"
          printf 'S6_07_FAILURE_CODE=S6_07_READINESS_FAILED\n' >> "${GITHUB_ENV}"
          container_id="$(docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" ps -q backend)"
          test -n "${container_id}"
          docker inspect "${container_id}" --format '{{json .State}}' > "${RUN_ROOT}/backend-state.json"
          database_backend="$(docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" exec -T backend \
            python -c 'import os; from sqlalchemy import create_engine; engine=create_engine(os.environ["COLD_STORAGE_DATABASE_URL"]); connection=engine.connect(); print(engine.dialect.name); connection.close(); engine.dispose()')"
          test -n "${database_backend}"
          docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" exec -T backend python - \
            > "${RUN_ROOT}/composition-manifest.json" <<'PY'
          import asyncio
          import contextlib
          import io
          import json

          from cold_storage.bootstrap.app import create_app
          from cold_storage.bootstrap.dependencies import (
              get_engine,
              get_production_coefficient_service,
          )
          from cold_storage.bootstrap.runtime_readiness import composition_manifest_tokens

          async def collect_manifest() -> dict[str, object]:
              app = create_app()
              async with app.router.lifespan_context(app):
                  engine = get_engine()
                  coefficient_service = get_production_coefficient_service()
                  return {
                      "active_coefficient_service_class": type(coefficient_service).__name__,
                      "active_service_bound_to_canonical_engine": coefficient_service.engine is engine,
                      "tokens": sorted(composition_manifest_tokens()),
                  }

          captured_stdout = io.StringIO()
          with contextlib.redirect_stdout(captured_stdout):
              manifest = asyncio.run(collect_manifest())
          print(json.dumps({
              **manifest,
              "observation_context": "active_application_lifespan",
          }, sort_keys=True))
          PY
          jq -e '.active_coefficient_service_class == "DatabaseCoefficientService" and
                 .active_service_bound_to_canonical_engine == true and
                 (.tokens | index("DATABASE_COEFFICIENT_SERVICE_INSTANTIATED")) != null and
                 (.tokens | index("PROCESS_LOCAL_COEFFICIENT_SERVICE_INSTANTIATED")) == null and
                 (.tokens | index("FAKE_AGENT_MODEL_GATEWAY_INSTANTIATED")) == null' \
            "${RUN_ROOT}/composition-manifest.json"
          runtime_facts="${RUN_ROOT}/runtime-facts.json"
          jq -n \
            --arg schema_version "task012-s6-07-runtime-facts-v1" \
            --arg database_backend "${database_backend}" \
            --argjson migration_exit_code "${migration_exit_code}" \
            '{schema_version:$schema_version,
              migration_exit_code:$migration_exit_code,
              database_backend:$database_backend}' \
            > "${runtime_facts}"
          jq -e '
            .schema_version == "task012-s6-07-runtime-facts-v1" and
            .migration_exit_code == 0 and
            (.database_backend | type == "string" and length > 0)
          ' "${runtime_facts}"
          test -s "${runtime_facts}"
          echo "RUNTIME_FACTS_HANDOFF=PASS"

      - name: Exercise canonical HTTP and persistence surfaces
        run: |
          set -euo pipefail
          {
            echo "S6_07_CURRENT_STEP=exercise_http_persistence_observability"
            echo "S6_07_FAILURE_CODE=S6_07_HTTP_SCOPE_FAILED"
          } >> "${GITHUB_ENV}"
          ACCEPTANCE_ROOT="${RUN_ROOT}/acceptance"
          mkdir -p "${ACCEPTANCE_ROOT}"
          runtime_facts="${RUN_ROOT}/runtime-facts.json"
          test -s "${runtime_facts}"
          jq -e '
            .schema_version == "task012-s6-07-runtime-facts-v1" and
            .migration_exit_code == 0 and
            (.database_backend | type == "string" and length > 0)
          ' "${runtime_facts}"
          CORRELATION_ID="$(
            python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"
          count_matches() {
            local output grep_status
            if output="$(grep "$@" "${ACCEPTANCE_ROOT}/backend.log")"; then
              if [ -z "${output}" ]; then
                printf '0\n'
              else
                printf '%s\n' "${output}" | wc -l | tr -d ' '
              fi
            else
              grep_status="$?"
              if [ "${grep_status}" -eq 1 ]; then
                printf '0\n'
              else
                return "${grep_status}"
              fi
            fi
          }
          curl_controlled() {
            curl --connect-timeout 5 --max-time 30 --retry 2 --retry-delay 2 \
              --retry-connrefused "$@"
          }
          capture_response() {
            local method="$1"
            local url="$2"
            local request_body="$3"
            local output="$4"
            local body_file="${output}.body"
            local status
            if [ "${method}" = "GET" ]; then
              status="$(curl_controlled --silent --show-error --output "${body_file}" \
                --write-out '%{http_code}' "${url}")"
            else
              status="$(curl_controlled --silent --show-error --output "${body_file}" \
                --write-out '%{http_code}' -X "${method}" "${url}" \
                -H 'Content-Type: application/json' -d "${request_body}")"
            fi
            jq -n --argjson status "${status}" --slurpfile body "${body_file}" \
              '{status:$status,body:$body[0]}' > "${output}"
          }

          ready_status="$(curl_controlled --silent --show-error --dump-header "${ACCEPTANCE_ROOT}/health.headers" \
            --output "${ACCEPTANCE_ROOT}/ready.body" --write-out '%{http_code}' \
            -H "X-Request-ID: ${CORRELATION_ID}" http://127.0.0.1:8000/health/ready)"
          jq -n --argjson status "${ready_status}" \
            --slurpfile body "${ACCEPTANCE_ROOT}/ready.body" \
            '{status:$status,body:$body[0]}' > "${ACCEPTANCE_ROOT}/ready.json"
          observed_correlation="$(awk -F': ' 'tolower($1)=="x-request-id" {gsub("\\r", "", $2); print $2; exit}' "${ACCEPTANCE_ROOT}/health.headers" || true)"
          header_present=false
          if grep -qi '^x-request-id:' "${ACCEPTANCE_ROOT}/health.headers"; then
            header_present=true
          fi

          coefficient_code="s6_07_operational_${GITHUB_RUN_ID}"
          coefficient_request="$(jq -nc --arg code "${coefficient_code}" \
            '{code:$code,name:"S6-07 controlled coefficient",description:"synthetic acceptance coefficient",category:"acceptance",canonical_unit:"unit",source_type:"controlled"}')"
          capture_response POST http://127.0.0.1:8000/api/v1/coefficients \
            "${coefficient_request}" "${ACCEPTANCE_ROOT}/coefficient.json"
          coefficient_id="$(jq -r '.body.id // empty' "${ACCEPTANCE_ROOT}/coefficient.json")"
          test -n "${coefficient_id}"
          capture_response GET "http://127.0.0.1:8000/api/v1/coefficients/${coefficient_id}" \
            '' "${ACCEPTANCE_ROOT}/coefficient-readback.json"

          capture_response POST http://127.0.0.1:8000/api/v1/agent/sessions \
            '{}' "${ACCEPTANCE_ROOT}/agent.json"

          project_json="${ACCEPTANCE_ROOT}/project.json"
          capture_response POST http://127.0.0.1:8000/api/v1/projects \
            '{"name":"S6-07 controlled project","location":"synthetic","product_category":"synthetic"}' \
            "${project_json}"
          project_id="$(jq -r '.body.id // empty' "${project_json}")"
          inputs='{"inputs":{"daily_inbound_mass_kg":25000,"working_time_h_per_day":16,"utilization_factor":0.85,"finished_storage_days":2.5,"packaging_storage_days":3,"main_packaging_storage_days":3,"auxiliary_packaging_storage_days":30,"reserve_factor":1.05,"precooling_required_ratio":1}}'
          capture_response PUT \
            "http://127.0.0.1:8000/api/v1/projects/${project_id}/versions/1/inputs" \
            "${inputs}" "${ACCEPTANCE_ROOT}/inputs.json"
          capture_response POST \
            "http://127.0.0.1:8000/api/v1/projects/${project_id}/versions/1/validate" \
            '' "${ACCEPTANCE_ROOT}/input-validation.json"
          capture_response POST \
            "http://127.0.0.1:8000/api/v1/projects/${project_id}/versions/1/planning-run" \
            '{}' "${ACCEPTANCE_ROOT}/planning-run.json"
          capture_response POST \
            "http://127.0.0.1:8000/api/v1/projects/${project_id}/versions/1/zone-plan" \
            '' "${ACCEPTANCE_ROOT}/zone-plan.json"
          capture_response POST \
            "http://127.0.0.1:8000/api/v1/projects/${project_id}/versions/1/investment-estimate" \
            '' "${ACCEPTANCE_ROOT}/investment.json"

          printf 'S6_07_FAILURE_CODE=S6_07_PERSISTENCE_FAILED\n' >> "${GITHUB_ENV}"
          printf 's6-07-persistence-probe\n' | docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" \
            exec -T backend sh -c 'cat > /opt/cold-storage/artifacts/s6-07-persistence-probe'

          export S6_07_PRODUCTION_AUTHORITY_OUTPUT="${ACCEPTANCE_ROOT}/production-authority.json"
          PYTHONPATH=backend/src uv run --project backend python \
            -m cold_storage.bootstrap.s6_07_controlled_fixture \
            create-production-authority \
            --database-url "${S6_07_POSTGRES_URL}" \
            --definition-id "${coefficient_id}" \
            --token "${GITHUB_RUN_ID}" \
            --output "${S6_07_PRODUCTION_AUTHORITY_OUTPUT}"
          production_run_id="$(jq -r '.create_response.body.run_id' \
            "${ACCEPTANCE_ROOT}/production-authority.json")"
          production_project_id="$(jq -r '.create_response.body.project_id' \
            "${ACCEPTANCE_ROOT}/production-authority.json")"
          test -n "${production_run_id}"
          test -n "${production_project_id}"
          capture_response GET \
            "http://127.0.0.1:8000/api/v1/projects/${production_project_id}/versions/1/scheme-runs/${production_run_id}" \
            '' "${ACCEPTANCE_ROOT}/scheme-http-readback-before-restart.json"
          jq -e --arg run_id "${production_run_id}" \
            '.status == 200 and .body.run_id == $run_id' \
            "${ACCEPTANCE_ROOT}/scheme-http-readback-before-restart.json"

          docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" restart backend
          for _ in $(seq 1 30); do
            if curl_controlled --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then break; fi
            sleep 2
          done
          restart_ready_status="$(curl_controlled --silent --show-error --output "${ACCEPTANCE_ROOT}/restart-ready.body" \
            --write-out '%{http_code}' http://127.0.0.1:8000/health/ready)"
          jq -n --argjson status "${restart_ready_status}" \
            --slurpfile body "${ACCEPTANCE_ROOT}/restart-ready.body" \
            '{status:$status,body:$body[0]}' > "${ACCEPTANCE_ROOT}/restart-ready.json"
          capture_response GET "http://127.0.0.1:8000/api/v1/projects/${project_id}" \
            '' "${ACCEPTANCE_ROOT}/project-after-restart.json"
          capture_response GET "http://127.0.0.1:8000/api/v1/coefficients/${coefficient_id}" \
            '' "${ACCEPTANCE_ROOT}/coefficient-after-restart.json"
          printf 'S6_07_FAILURE_CODE=S6_07_OBSERVABILITY_FAILED\n' >> "${GITHUB_ENV}"
          artifact_probe_exists=false
          artifact_probe_sha256=""
          if docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" exec -T backend \
            test -s /opt/cold-storage/artifacts/s6-07-persistence-probe; then
            artifact_probe_exists=true
            artifact_probe_sha256="$(docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" exec -T backend \
              sha256sum /opt/cold-storage/artifacts/s6-07-persistence-probe | cut -d' ' -f1)"
          fi

          docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" logs --no-log-prefix backend > "${ACCEPTANCE_ROOT}/backend.log"
          password_occurrences="$(count_matches -F -o "${S6_07_POSTGRES_PASSWORD}")"
          database_url_occurrences="$(count_matches -Eio 'postgresql(\\+psycopg2)?://|redis://|database_url')"
          token_occurrences="$(count_matches -Eio 'bearer |ghp_|github_pat_')"
          PYTHONPATH=backend/src uv run --project backend python \
            -m cold_storage.release.end_to_end_operational_acceptance \
            summarize-s6-07-log-observations \
            --log-path "${ACCEPTANCE_ROOT}/backend.log" \
            --expected-correlation-id "${CORRELATION_ID}" \
            --expected-request-id "${CORRELATION_ID}" \
            > "${ACCEPTANCE_ROOT}/structured-log-observations.json"
          structured_record_count="$(jq -r '.record_count' "${ACCEPTANCE_ROOT}/structured-log-observations.json")"
          parseable_record_count="$(jq -r '.parseable_record_count' "${ACCEPTANCE_ROOT}/structured-log-observations.json")"
          correlation_match_count="$(jq -r '.correlation_match_count' "${ACCEPTANCE_ROOT}/structured-log-observations.json")"
          log_correlation_observed="$(jq -r '.matched_correlation_id // empty' "${ACCEPTANCE_ROOT}/structured-log-observations.json")"
          log_request_observed="$(jq -r '.matched_request_id // empty' "${ACCEPTANCE_ROOT}/structured-log-observations.json")"
          echo "OBSERVED_CORRELATION_HEADER_PRESENT=${header_present}"
          echo "OBSERVED_CORRELATION_EXPECTED=${CORRELATION_ID}"
          echo "OBSERVED_CORRELATION_OBSERVED=${observed_correlation}"
          echo "OBSERVED_CORRELATION_LOG_OBSERVED=${log_correlation_observed}"
          echo "OBSERVED_REQUEST_LOG_OBSERVED=${log_request_observed}"
          echo "OBSERVED_STRUCTURED_RECORD_COUNT=${structured_record_count}"
          echo "OBSERVED_PARSEABLE_RECORD_COUNT=${parseable_record_count}"
          echo "OBSERVED_CORRELATION_MATCH_COUNT=${correlation_match_count}"

          capture_response GET \
            "http://127.0.0.1:8000/api/v1/projects/${production_project_id}/versions/1/scheme-runs/${production_run_id}" \
            '' "${ACCEPTANCE_ROOT}/scheme-http-readback-after-restart.json"
          jq -e --arg run_id "${production_run_id}" \
            '.status == 200 and .body.run_id == $run_id' \
            "${ACCEPTANCE_ROOT}/scheme-http-readback-after-restart.json"

          export S6_07_RELOAD_AUTHORITY_OUTPUT="${ACCEPTANCE_ROOT}/production-authority-after-restart.json"
          PYTHONPATH=backend/src uv run --project backend python \
            -m cold_storage.bootstrap.s6_07_controlled_fixture \
            reload-production-authority \
            --database-url "${S6_07_POSTGRES_URL}" \
            --run-id "${production_run_id}" \
            --definition-id "${coefficient_id}" \
            --output "${S6_07_RELOAD_AUTHORITY_OUTPUT}"

          jq -n \
            --arg source_sha "${SOURCE_SHA}" --arg source_tree_sha "${SOURCE_TREE_SHA}" \
            --slurpfile identity "${RUN_ROOT}/build-identity.json" \
            --slurpfile composition "${RUN_ROOT}/composition-manifest.json" \
            --slurpfile runtime_facts "${RUN_ROOT}/runtime-facts.json" \
            --slurpfile live "${RUN_ROOT}/live-response.json" \
            --slurpfile ready "${ACCEPTANCE_ROOT}/ready.json" \
            --slurpfile state "${RUN_ROOT}/backend-state.json" \
            --slurpfile coefficient "${ACCEPTANCE_ROOT}/coefficient.json" \
            --slurpfile coefficient_readback "${ACCEPTANCE_ROOT}/coefficient-readback.json" \
            --slurpfile agent "${ACCEPTANCE_ROOT}/agent.json" \
            --slurpfile project_create "${ACCEPTANCE_ROOT}/project.json" \
            --slurpfile inputs_update "${ACCEPTANCE_ROOT}/inputs.json" \
            --slurpfile input_validation "${ACCEPTANCE_ROOT}/input-validation.json" \
            --slurpfile planning_run "${ACCEPTANCE_ROOT}/planning-run.json" \
            --slurpfile zone_plan "${ACCEPTANCE_ROOT}/zone-plan.json" \
            --slurpfile investment "${ACCEPTANCE_ROOT}/investment.json" \
            --slurpfile project_after_restart "${ACCEPTANCE_ROOT}/project-after-restart.json" \
            --slurpfile structured_logs "${ACCEPTANCE_ROOT}/structured-log-observations.json" \
            --slurpfile production "${ACCEPTANCE_ROOT}/production-authority.json" \
            --slurpfile scheme_http_before "${ACCEPTANCE_ROOT}/scheme-http-readback-before-restart.json" \
            --slurpfile scheme_http_after "${ACCEPTANCE_ROOT}/scheme-http-readback-after-restart.json" \
            --slurpfile production_after_restart "${ACCEPTANCE_ROOT}/production-authority-after-restart.json" \
            --slurpfile restart_ready "${ACCEPTANCE_ROOT}/restart-ready.json" \
            --slurpfile restart_coefficient "${ACCEPTANCE_ROOT}/coefficient-after-restart.json" \
            --arg correlation_expected "${CORRELATION_ID}" --arg correlation_observed "${observed_correlation}" \
            --arg correlation_log_observed "${log_correlation_observed}" \
            --arg request_expected "${CORRELATION_ID}" --arg request_log_observed "${log_request_observed}" \
            --argjson header_present "${header_present}" --argjson artifact_probe_exists "${artifact_probe_exists}" \
            --arg artifact_probe_sha256 "${artifact_probe_sha256}" \
            --argjson password_occurrences "${password_occurrences}" \
            --argjson database_url_occurrences "${database_url_occurrences}" \
            --argjson token_occurrences "${token_occurrences}" \
            --argjson structured_record_count "${structured_record_count}" \
            --argjson parseable_record_count "${parseable_record_count}" \
            --argjson correlation_match_count "${correlation_match_count}" \
            ' {
                schema_version:"task012-s6-07-operational-observation-v3",
                observation_type:"raw",
                task:"TASK-012", version:"V0.2", slice:6, item:"S6-07",
                source_sha:$source_sha, source_tree_sha:$source_tree_sha,
                controlled_synthetic:true, real_production_data:false,
                real_production_operation:false,
                runtime_lifecycle:{
                  build_identity:($identity[0] + {file_present:true}),
                  migration:{exit_code:$runtime_facts[0].migration_exit_code,current_output:""},
                  container:{running:$state[0].Running,status:$state[0].Status},
                  liveness:$live[0], readiness:$ready[0],
                  database:{backend:$runtime_facts[0].database_backend,
                    service_class:$composition[0].active_coefficient_service_class,
                    composition_manifest:$composition[0]},
                  artifact_storage:{probe_exists:$artifact_probe_exists,probe_sha256:$artifact_probe_sha256}
                },
                production_http_scope:{
                  coefficient:{created:$coefficient[0],readback:$coefficient_readback[0],persisted_row_id:($coefficient[0].body.id // null)},
                  controlled_coefficient:($production[0].controlled_coefficient // {}),
                  authority_continuity:{
                    definition_to_revision:(($production[0].controlled_coefficient.approved_revision_definition_id // null) == ($coefficient[0].body.id // null)),
                    revision_to_active_authority:(($production[0].controlled_coefficient.approved_revision_id // null) == ($production[0].controlled_coefficient.active_authority_revision_id // null)),
                    independent_from_five_stage_context:(($production[0].controlled_coefficient.coefficient_context_id // null) == null and ($production[0].controlled_coefficient.source_binding_coefficient_context_id // null) == null)
                  },
                  planning_agent:{response:$agent[0]},
                  project_calculation:{
                    project_create:$project_create[0],
                    inputs_update:$inputs_update[0],
                    input_validation:$input_validation[0],
                    planning_run:$planning_run[0],
                    zone_plan:$zone_plan[0],
                    investment_estimate:$investment[0],
                    project_after_restart:$project_after_restart[0]
                  }
                },
                  persistence_e2e:{
                    scheme:{
                      create_response:$production[0].create_response,
                      persisted_readback:$scheme_http_before[0],
                      http_readback:$scheme_http_before[0],
                      canonical_persistence:$production[0].canonical_persistence
                    },
                    restart:{
                      performed:true,
                      readiness:$restart_ready[0],
                      coefficient_readback:($restart_coefficient[0].body // {}),
                      scheme_persisted_readback:$scheme_http_after[0],
                      source_binding_after_restart:($production_after_restart[0].source_binding + {reloaded_after_restart:true}),
                      source_archive_verification_after_restart:($production_after_restart[0].source_archive + {reloaded_after_restart:true}),
                      controlled_coefficient_after_restart:($production_after_restart[0].controlled_coefficient // {}),
                      artifact_probe:{exists:$artifact_probe_exists,sha256:$artifact_probe_sha256}
                    }
                  },
                observability_security:{
                  correlation:{header_present:$header_present,correlation_id_expected:$correlation_expected,correlation_id_observed:$correlation_log_observed,request_id_expected:$request_expected,request_id_observed:$request_log_observed,response_request_id:$correlation_observed},
                  structured_logging:{record_count:$structured_record_count,parseable_record_count:$parseable_record_count,correlation_match_count:$correlation_match_count,matched_correlation_id:$structured_logs[0].matched_correlation_id,matched_request_id:$structured_logs[0].matched_request_id},
                  redaction:{password_occurrences:$password_occurrences,database_url_occurrences:$database_url_occurrences,token_occurrences:$token_occurrences}
                }
              }' > "${ACCEPTANCE_ROOT}/observations.json"
          jq --arg migration_output "$(cat "${RUN_ROOT}/alembic-current.txt")" \
            '.runtime_lifecycle.migration.current_output=$migration_output' \
            "${ACCEPTANCE_ROOT}/observations.json" > "${ACCEPTANCE_ROOT}/observations.tmp"
          mv "${ACCEPTANCE_ROOT}/observations.tmp" "${ACCEPTANCE_ROOT}/observations.json"
          {
            echo "ACCEPTANCE_ROOT=${ACCEPTANCE_ROOT}"
          } >> "${GITHUB_ENV}"

      - name: Assemble S6-07 acceptance evidence
        run: |
          set -euo pipefail
          {
            echo "S6_07_CURRENT_STEP=assemble_acceptance_evidence"
            echo "S6_07_FAILURE_CODE=S6_07_EVIDENCE_ASSEMBLY_FAILED"
          } >> "${GITHUB_ENV}"
          if ! PYTHONPATH=backend/src uv run --project backend python \
            -m cold_storage.release.end_to_end_operational_acceptance \
            assemble-s6-07-acceptance-evidence \
            --source-sha "${SOURCE_SHA}" --source-tree-sha "${SOURCE_TREE_SHA}" \
            --s6-06-run-id "${S6_06_RUN_ID}" --s6-06-run-attempt "${S6_06_RUN_ATTEMPT}" \
            --s6-06-artifact-id "${S6_06_ARTIFACT_ID}" \
            --s6-06-artifact-digest "${S6_06_ARTIFACT_DIGEST}" \
            --s6-06-bundle-dir "${S6_06_BUNDLE}" \
            --s6-06-metadata-dir "${S6_06_METADATA}" \
            --observations "${ACCEPTANCE_ROOT}/observations.json" \
            --output-dir "${RUN_ROOT}/bundle" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"; then
            echo "ERROR_CODE=S6_07_EVIDENCE_ASSEMBLY_FAILED"
            echo "S6_07_FAILURE_CODE=S6_07_EVIDENCE_ASSEMBLY_FAILED" >> "${GITHUB_ENV}"
            exit 1
          fi
          echo "S6_07_ASSEMBLY=PASS"

      - name: Independently verify S6-07 evidence from bundle root
        run: |
          set -euo pipefail
          {
            echo "S6_07_CURRENT_STEP=independent_verification"
            echo "S6_07_FAILURE_CODE=S6_07_INDEPENDENT_VERIFICATION_FAILED"
          } >> "${GITHUB_ENV}"
          BUNDLE_DIR="${RUN_ROOT}/bundle"
          (
            cd "${BUNDLE_DIR}"
            if ! PYTHONPATH="${GITHUB_WORKSPACE}/backend/src" uv run --project "${GITHUB_WORKSPACE}/backend" python \
              -m cold_storage.release.end_to_end_operational_acceptance \
              verify-s6-07-acceptance-evidence \
              --source-sha "${SOURCE_SHA}" --source-tree-sha "${SOURCE_TREE_SHA}" \
              --s6-06-run-id "${S6_06_RUN_ID}" --s6-06-run-attempt "${S6_06_RUN_ATTEMPT}" \
              --s6-06-artifact-id "${S6_06_ARTIFACT_ID}" \
              --s6-06-artifact-digest "${S6_06_ARTIFACT_DIGEST}" \
              --s6-06-bundle-dir "${S6_06_BUNDLE}" \
              --s6-06-metadata-dir "${S6_06_METADATA}" \
              --bundle-dir "${PWD}"; then
              echo "ERROR_CODE=S6_07_INDEPENDENT_VERIFICATION_FAILED"
              echo "S6_07_FAILURE_CODE=S6_07_INDEPENDENT_VERIFICATION_FAILED" >> "${GITHUB_ENV}"
              exit 1
            fi
            if ! sha256sum -c SHA256SUMS || ! sha256sum -c SHA256SUMS.sha256; then
              echo "ERROR_CODE=S6_07_CHECKSUM_MISMATCH"
              echo "S6_07_FAILURE_CODE=S6_07_CHECKSUM_MISMATCH" >> "${GITHUB_ENV}"
              exit 1
            fi
            if [ "$(find . -maxdepth 1 -type f | wc -l)" -ne 9 ]; then
              echo "ERROR_CODE=S6_07_INDEPENDENT_VERIFICATION_FAILED"
              echo "S6_07_FAILURE_CODE=S6_07_INDEPENDENT_VERIFICATION_FAILED" >> "${GITHUB_ENV}"
              exit 1
            fi
          )
          echo "S6_07_INDEPENDENT_VERIFICATION=PASS"

      - name: Validate S6-07 acceptance artifact for upload
        run: |
          set -euo pipefail
          {
            echo "S6_07_CURRENT_STEP=upload_acceptance_evidence"
            echo "S6_07_FAILURE_CODE=S6_07_ARTIFACT_UPLOAD_FAILED"
          } >> "${GITHUB_ENV}"
          if [ ! -d "${RUN_ROOT}/bundle" ] || [ "$(find "${RUN_ROOT}/bundle" -maxdepth 1 -type f | wc -l)" -ne 9 ]; then
            echo "ERROR_CODE=S6_07_ARTIFACT_UPLOAD_FAILED"
            echo "S6_07_FAILURE_CODE=S6_07_ARTIFACT_UPLOAD_FAILED" >> "${GITHUB_ENV}"
            exit 1
          fi

      - name: Upload S6-07 acceptance evidence
        id: upload_s6_07
        uses: actions/upload-artifact@v4
        with:
          name: task012-s6-07-operational-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task012-s6-07/${{ github.run_id }}-${{ github.run_attempt }}/bundle
          if-no-files-found: error
          compression-level: 0
          overwrite: false

      - name: Record S6-07 evidence handoff
        env:
          ARTIFACT_ID: ${{ steps.upload_s6_07.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_s6_07.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload_s6_07.outputs.artifact-url }}
        run: |
          set -euo pipefail
          {
            echo "S6_07_CURRENT_STEP=record_acceptance_handoff"
            echo "S6_07_FAILURE_CODE=S6_07_ARTIFACT_UPLOAD_FAILED"
          } >> "${GITHUB_ENV}"
          test -n "${ARTIFACT_ID}"
          test -n "${ARTIFACT_DIGEST}"
          test -n "${ARTIFACT_URL}"
          {
            echo "### S6-07 controlled operational acceptance"
            echo "artifact-id: ${ARTIFACT_ID}"
            echo "artifact-digest: ${ARTIFACT_DIGEST}"
            echo "artifact-url: ${ARTIFACT_URL}"
            echo "source-sha: ${SOURCE_SHA}"
            echo "source-tree-sha: ${SOURCE_TREE_SHA}"
            echo "controlled-synthetic: true"
            echo "real-production-operation: false"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Record failure diagnostics
        if: failure()
        run: |
          set +e
          RUN_ROOT="${RUN_ROOT:-${RUNNER_TEMP}/task012-s6-07/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          DIAGNOSTIC_ROOT="${DIAGNOSTIC_ROOT:-${RUN_ROOT}/diagnostics}"
          mkdir -p "${DIAGNOSTIC_ROOT}"
          printf '%s\n' \
            'DIAGNOSTIC_ONLY=true' \
            'ACCEPTANCE_AUTHORITY=false' \
            "failed_step=${S6_07_CURRENT_STEP:-unknown}" \
            "error_code=${S6_07_FAILURE_CODE:-S6_07_EVIDENCE_BUNDLE_INVALID}" \
            "run_id=${GITHUB_RUN_ID}" \
            "run_attempt=${GITHUB_RUN_ATTEMPT}" \
            "source_sha=${SOURCE_SHA:-}" \
            "source_tree_sha=${SOURCE_TREE_SHA:-}" \
            'raw_backend_log_included=false' \
            'secrets_included=false' \
            > "${DIAGNOSTIC_ROOT}/failure-summary.txt"
          for safe_file in \
            "${RUN_ROOT}/s6-06-run.json" \
            "${RUN_ROOT}/s6-06-artifact.json" \
            "${RUN_ROOT}/runtime-facts.json" \
            "${RUN_ROOT}/build-identity.json" \
            "${RUN_ROOT}/composition-manifest.json" \
            "${RUN_ROOT}/observations.json" \
            "${RUN_ROOT}/acceptance/observations.json"; do
            if [ -f "${safe_file}" ]; then
              cp "${safe_file}" "${DIAGNOSTIC_ROOT}/$(basename "${safe_file}")"
            fi
          done

      - name: Upload S6-07 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: task012-s6-07-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task012-s6-07/${{ github.run_id }}-${{ github.run_attempt }}/diagnostics
          if-no-files-found: error
          compression-level: 0
          overwrite: false

      - name: Cleanup controlled runtime
        if: always()
        run: |
          if [ "${RUNTIME_CONTEXT_INITIALIZED:-false}" = "true" ] \
            && [ -n "${COMPOSE_OVERRIDE:-}" ] && [ -f "${COMPOSE_OVERRIDE}" ]; then
            docker compose -f docker-compose.production.yml -f "${COMPOSE_OVERRIDE}" down -v --remove-orphans || true
          else
            echo "CLEANUP_SKIPPED_NO_RUNTIME_CONTEXT=YES"
          fi
