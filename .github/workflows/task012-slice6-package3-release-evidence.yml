name: task012-slice6-package3-release-evidence

on:
  workflow_dispatch:
    inputs:
      execute_final_release_evidence_assembly:
        description: Explicitly authorize S6-06 final evidence assembly
        required: true
        type: boolean
        default: false
      expected_source_sha:
        description: Exact main commit authorized for S6-06 assembly
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  final-release-evidence:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      inputs.execute_final_release_evidence_assembly == true &&
      github.ref == 'refs/heads/main' &&
      github.sha == inputs.expected_source_sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4

      - name: Install backend
        run: cd backend && uv sync

      - name: Validate dynamic exact-main and Package 3 lineage gates
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          PACKAGE3_IMPLEMENTATION_HEAD_SHA: 15952da351c922939f82d5e32bdd60216537fcdb
          IMPLEMENTATION_BASE_SHA: 7b36d68afb94577db401b8825013cc14ab0943d7
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${EXPECTED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
          SOURCE_TREE_SHA="$(git rev-parse HEAD^{tree})"
          test -n "${SOURCE_TREE_SHA}"
          git merge-base --is-ancestor \
            "${PACKAGE3_IMPLEMENTATION_HEAD_SHA}" "${GITHUB_SHA}"
          git merge-base --is-ancestor \
            "${IMPLEMENTATION_BASE_SHA}" "${GITHUB_SHA}"
          {
            echo "SOURCE_SHA=${GITHUB_SHA}"
            echo "SOURCE_TREE_SHA=${SOURCE_TREE_SHA}"
          } >> "${GITHUB_ENV}"
          echo "PACKAGE3_IMPLEMENTATION_HEAD_ANCESTOR_GATE=PASS"
          echo "IMPLEMENTATION_BASE_ANCESTOR_GATE=PASS"

      - name: Fetch authoritative GitHub workflow-run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ROOT: ${{ runner.temp }}/task012-s6-06/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "${RUN_ROOT}/github-metadata"
          PYTHONPATH=backend/src uv run --project backend python \
            -m cold_storage.release.final_release_evidence \
            write-frozen-authority-index \
            --output "${RUN_ROOT}/authority-index.json" \
            --source-sha "${SOURCE_SHA}" \
            --source-tree-sha "${SOURCE_TREE_SHA}"
          while IFS= read -r run_id; do
            test -n "${run_id}"
            gh api \
              --header 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              > "${RUN_ROOT}/github-metadata/run-${run_id}.json"
          done < <(
            jq -r '.authorities[] | select(.workflow_run_id != null) | .workflow_run_id' \
              "${RUN_ROOT}/authority-index.json" | sort -nu
          )
          while IFS= read -r artifact_id; do
            test -n "${artifact_id}"
            gh api \
              --header 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
              > "${RUN_ROOT}/github-metadata/artifact-${artifact_id}.json"
          done < <(
            jq -r '.authorities[] | select(.artifact_id != null) | .artifact_id' \
              "${RUN_ROOT}/authority-index.json" | sort -nu
          )
          test -n "$(find "${RUN_ROOT}/github-metadata" -type f -name '*.json' -print -quit)"
          echo "GITHUB_METADATA_FETCH=PASS"

      - name: Assemble final release evidence (ASSEMBLY=PASS)
        env:
          RUN_ROOT: ${{ runner.temp }}/task012-s6-06/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PYTHONPATH=backend/src uv run --project backend python \
            -m cold_storage.release.final_release_evidence \
            assemble-final-release-evidence \
            --authority-index "${RUN_ROOT}/authority-index.json" \
            --output-dir "${RUN_ROOT}/bundle" \
            --source-sha "${SOURCE_SHA}" \
            --source-tree-sha "${SOURCE_TREE_SHA}" \
            --generated-at "${GENERATED_AT}" \
            --github-metadata-dir "${RUN_ROOT}/github-metadata"
          echo "ASSEMBLY=PASS"

      - name: Independently verify final release evidence (INDEPENDENT_VERIFICATION=PASS)
        env:
          RUN_ROOT: ${{ runner.temp }}/task012-s6-06/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="${RUN_ROOT}/bundle"
          (
            cd "${BUNDLE_DIR}"
            PYTHONPATH="${GITHUB_WORKSPACE}/backend/src" uv run \
              --project "${GITHUB_WORKSPACE}/backend" python \
              -m cold_storage.release.final_release_evidence \
              verify-final-release-evidence \
              --bundle-dir "${PWD}" \
              --source-sha "${SOURCE_SHA}" \
              --source-tree-sha "${SOURCE_TREE_SHA}" \
              --github-metadata-dir "${RUN_ROOT}/github-metadata"
            sha256sum -c SHA256SUMS
            sha256sum -c SHA256SUMS.sha256
            test "$(find . -maxdepth 1 -type f | wc -l)" -eq 8
          )
          echo "INDEPENDENT_VERIFICATION=PASS"

      - name: Upload final release evidence bundle
        id: upload_final_evidence
        uses: actions/upload-artifact@v4
        with:
          name: task012-s6-06-final-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task012-s6-06/${{ github.run_id }}-${{ github.run_attempt }}/bundle
          if-no-files-found: error
          compression-level: 0
          overwrite: false

      - name: Record final release evidence handoff
        env:
          ARTIFACT_ID: ${{ steps.upload_final_evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_final_evidence.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload_final_evidence.outputs.artifact-url }}
          ARTIFACT_NAME: task012-s6-06-final-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_ID}"
          test -n "${ARTIFACT_DIGEST}"
          test -n "${ARTIFACT_URL}"
          {
            echo "### S6-06 final release evidence handoff"
            echo "artifact-id: ${ARTIFACT_ID}"
            echo "artifact-digest: ${ARTIFACT_DIGEST}"
            echo "artifact-url: ${ARTIFACT_URL}"
            echo "artifact-name: ${ARTIFACT_NAME}"
            echo "source-sha: ${SOURCE_SHA}"
            echo "source-tree-sha: ${SOURCE_TREE_SHA}"
            echo "s6-07-status: NOT_AUTHORIZED"
          } >> "${GITHUB_STEP_SUMMARY}"
