<svg xmlns='http://www.w3.org/2000/svg' viewBox='-150 -2150 2600 2650' role='img' aria-label='柜门逐层扫掠高度侧视'><rect x='-150' y='-2150' width='2600' height='2650' fill='white'/><rect x='0' y='-1800' width='500' height='1800' fill='#87a9c8' ><title>柜体侧面</title></rect><rect x='500' y='-400' width='360' height='300' fill='#edac71' fill-opacity='.7'><title>门扇扫掠投影，实际碰撞采用三维扇形</title></rect><text x='30' y='-200' font-size='75'>100–400 mm</text><rect x='500' y='-720' width='360' height='300' fill='#edac71' fill-opacity='.7'><title>门扇扫掠投影，实际碰撞采用三维扇形</title></rect><text x='30' y='-520' font-size='75'>420–720 mm</text><rect x='500' y='-1040' width='360' height='300' fill='#edac71' fill-opacity='.7'><title>门扇扫掠投影，实际碰撞采用三维扇形</title></rect><text x='30' y='-840' font-size='75'>740–1040 mm</text><rect x='500' y='-1360' width='360' height='300' fill='#edac71' fill-opacity='.7'><title>门扇扫掠投影，实际碰撞采用三维扇形</title></rect><text x='30' y='-1160' font-size='75'>1060–1360 mm</text><rect x='500' y='-1680' width='360' height='300' fill='#edac71' fill-opacity='.7'><title>门扇扫掠投影，实际碰撞采用三维扇形</title></rect><text x='30' y='-1480' font-size='75'>1380–1680 mm</text><rect x='880' y='-1800' width='600' height='1800' fill='#e8ab43' ><title>柜前人体占用假设</title></rect><rect x='1480' y='-100' width='1200' height='100' fill='#cdece6' ><title>净通道投影</title></rect><text x='0' y='-1920' font-size='100'>逐层门扇与人体 · 等比例侧视</text><text x='0' y='210' font-size='80'>柜深500 / 前退让380 / 人体600 / 走道1200 mm</text><text x='0' y='360' font-size='75'>仅占用与扫掠；弯腰、伸手、梯具和穿衣动作尚未验证</text></svg>